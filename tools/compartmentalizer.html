<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light">
<title>Compartmentalizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* UNIVERSAL RULE — no blue overlay, ever. No blue tap highlight, no blue focus ring. Focus is a neutral grey border only. */
*{-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}
*:focus{outline:none!important}
*:focus-visible{outline:none!important;box-shadow:none!important}
input:focus,textarea:focus,button:focus{outline:none!important;box-shadow:none!important;border-color:#a1a1a6!important}
::selection{background:#e5e5ea;color:#1d1d1f}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 110px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#86868b;font-weight:600}
h1{font-size:40px;line-height:1.05;letter-spacing:-.03em;margin:10px 0 8px;font-weight:800}
.sub{color:#86868b;font-size:15px;margin:0}
.saved{font-size:12px;color:#86868b;margin-top:10px}
.saved b{color:#1d1d1f}
.card{background:#fff;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);text-align:left}
h2{font-size:17px;letter-spacing:-.01em;margin:0 0 14px;font-weight:700}
label{display:block;font-size:12px;font-weight:600;color:#86868b;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px;text-align:left}
input[type=text],input[type=number]{width:100%;background:#f5f5f7;border:1px solid #e2e2e7;color:#1d1d1f;border-radius:12px;padding:13px 14px;font-size:15px;font-family:Inter,sans-serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}h1{font-size:32px}}
.btn{border:0;border-radius:12px;padding:15px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#1d1d1f;color:#fff;font-family:Inter,sans-serif;width:100%}
.btn.sec{background:#f5f5f7;color:#1d1d1f;border:1px solid #e2e2e7}
.btn.danger{background:#fff;color:#c81e1e;border:1px solid #f0c6c6}
.btn:active{transform:scale(.99)}
.smallbtn{border:1px solid #e2e2e7;background:#fff;color:#1d1d1f;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
.smallbtn.danger{color:#c81e1e;border-color:#f0c6c6}
.back{border:0;background:transparent;color:#0071e3;font-size:15px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;padding:4px 0;text-align:left}
.codepill{display:inline-block;background:#f5f5f7;border:1px solid #e2e2e7;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:#6e6e73;margin-top:6px}
/* Subject tiles — full-width, lengthwise */
.subj-tile{background:#fff;border-radius:20px;padding:20px 22px;margin-top:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:left;transition:transform .15s ease,box-shadow .15s ease}
.subj-tile:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.subj-tile h3{margin:0;font-size:19px;letter-spacing:-.02em}
.subj-tile .meta{font-size:12px;color:#86868b;margin-top:5px;font-weight:600}
.chev{font-size:20px;color:#86868b;flex-shrink:0}
/* Subject / chapter page header */
.pagehead{position:relative;text-align:center;padding:8px 44px 0}
.pagehead h2{font-size:28px;letter-spacing:-.02em;margin:0}
.editbtn{position:absolute;top:0;right:0;width:38px;height:38px;border-radius:50%;border:1px solid #e2e2e7;background:#fff;color:#1d1d1f;cursor:pointer;display:grid;place-items:center;font-family:Inter,sans-serif}
.editbtn svg{width:17px;height:17px}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
@media(max-width:560px){.overview{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid #e8e8ed;border-radius:16px;padding:14px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:#86868b;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
/* Chapter rows */
.chapter-row{background:#fff;border-radius:20px;padding:18px 20px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;text-align:left}
.chapter-row h4{margin:0;font-size:18px;line-height:1.35}
.chapter-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.chapter-meta .count{font-size:12px;color:#86868b;font-weight:600}
.pill{font-size:12px;font-weight:600;color:#1d1d1f;background:#f5f5f7;border:1px solid #e2e2e7;border-radius:999px;padding:5px 10px}
.pill.diff-easy{color:#137333}
.pill.diff-hard{color:#c81e1e}
.pill.imp-very{color:#7c2d12;font-weight:700}
textarea{width:100%;background:#f5f5f7;border:1px solid #e2e2e7;color:#1d1d1f;border-radius:12px;padding:13px 14px;font-size:15px;font-family:Inter,sans-serif;min-height:96px;resize:vertical}
.view-note{background:#f5f5f7;border:1px solid #e2e2e7;border-radius:12px;padding:13px 14px;font-size:15px;line-height:1.6;text-align:left;white-space:pre-wrap;margin-top:6px}
.topic-main{flex:1;min-width:0;text-align:left}
.topic-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.note-preview{font-size:12px;color:#86868b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.section-label{font-size:12px;font-weight:600;color:#86868b;letter-spacing:.06em;text-transform:uppercase;text-align:left;margin:26px 0 0}
/* Topics */
.topic{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #e2e2e7;border-radius:14px;padding:9px 10px;margin-top:8px;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}
.topic.dragging{opacity:.92;box-shadow:0 12px 28px rgba(0,0,0,.18);z-index:5;position:relative}
.topic.drop-before{border-top:2px solid #1d1d1f}
.topic.drop-after{border-bottom:2px solid #1d1d1f}
.handle{touch-action:none;cursor:grab;color:#a1a1a6;font-size:18px;padding:6px 4px;flex-shrink:0;user-select:none;-webkit-user-select:none}
.handle:active{cursor:grabbing}
.topic .name{font-size:15px;font-weight:600;text-align:left;line-height:1.4}
.del{border:0;background:transparent;color:#c81e1e;font-size:18px;cursor:pointer;padding:6px;flex-shrink:0}
/* FAB — one + button, bottom-right, action follows the page */
.fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:#1d1d1f;color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.22);z-index:40}
.fab:active{transform:scale(.96)}
.empty{color:#86868b;font-size:14px}
/* Custom pop-ups — blurred backdrop, scale-in */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.modalbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:420px;text-align:left;animation:popin .22s ease;max-height:88vh;overflow-y:auto}
@keyframes popin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modalbox h2{font-size:21px;text-align:center}
.modalbox p{color:#86868b;font-size:14px;line-height:1.6}
.modalbox .center{text-align:center}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
/* Custom dropdowns — no native select anywhere. Custom CSS chevron, no text arrow. */
.dd{position:relative}
.dd-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:#f5f5f7;border:1px solid #e2e2e7;color:#1d1d1f;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;text-align:left}
.dd-btn.pill{width:auto;padding:8px 11px;font-size:12px;border-radius:999px;background:#fff;min-width:118px}
.chev-css{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s ease;flex-shrink:0;margin-top:-3px}
.dd.open .chev-css{transform:rotate(225deg);margin-top:2px}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:180px;background:#fff;border:1px solid #e2e2e7;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.16);padding:6px;display:none;z-index:30;animation:dropin .18s ease}
.dd.open .dd-menu{display:block}
@keyframes dropin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.dd-opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:#1d1d1f;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;text-align:left}
.dd-opt:hover{background:#f5f5f7}
.dd-opt .tick{color:#1d1d1f;font-weight:800}
.dd-btn.diff-easy{color:#137333}
.dd-btn.diff-hard{color:#c81e1e}
.dd-btn.imp-very{color:#7c2d12;font-weight:700}
/* Custom toast — no native alert anywhere */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:28px;background:#1d1d1f;color:#fff;padding:13px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 12px 32px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Save as PDF — print only. Flowing pages, topics kept whole, footer repeats on every page. */
#printArea{display:none}
#printFooter{display:none}
@media print{
@page{size:A4;margin:18mm 16mm 22mm 16mm}
html,body{background:#fff}
.wrap,.fab,#toast,.modal{display:none!important}
#printArea{display:block!important;text-align:left;color:#1d1d1f}
#printFooter{display:flex!important;position:fixed;bottom:0;left:0;right:0;justify-content:space-between;align-items:center;font-size:11px;color:#6e6e73;border-top:1px solid #d2d2d7;padding-top:8px;background:#fff}
#printFooter a{color:#1d1d1f;text-decoration:none;font-weight:600}
#printFooter svg{width:16px;height:16px}
}
.print-chapter h1{font-size:26px;text-align:center;margin:0 0 6px}
.print-chapter .pline{text-align:center;color:#6e6e73;font-size:14px;margin:3px 0}
.print-topic{break-inside:avoid;page-break-inside:avoid;margin-top:18px}
.print-topic h3{font-size:16px;margin:0 0 4px}
.print-topic .pmeta{font-size:12px;color:#6e6e73;font-weight:600}
.print-topic .pnote{font-size:14px;line-height:1.65;white-space:pre-wrap;margin-top:8px}

</style>
</head>
<body>
<div class="wrap">
<header>
<div class="eyebrow">Subject Manager</div>
<h1>Compartmentalizer</h1>
<p class="sub">Subjects, Chapters, Topic</p>
<p class="saved"><b>● Saved in this browser</b></p>
</header>

<div id="viewMain"></div>
<div id="viewSubject" style="display:none"></div>
<div id="viewChapter" style="display:none"></div>
</div>

<div id="printArea"></div>
<div id="printFooter"><span>Made with <a href="https://abybijo.github.io/learning-tools/tools/compartmentalizer.html">Compartmentalizer</a></span><a href="https://github.com/AbyBijo/learning-tools/blob/main/tools/compartmentalizer.html" aria-label="Compartmentalizer on GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.15c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.11-.74.4-1.25.72-1.53-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 1.67.41.35.77 1.05.77 2.12v3.15c0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg></a></div>

<button class="fab" id="fab" onclick="fabAction()" aria-label="Add">+</button>

<div id="toast" role="status"></div>

<div class="modal" id="formModal"><div class="modalbox">
<h2 id="formTitle"></h2>
<div id="formBody"></div>
<div class="row"><button class="btn sec" onclick="closeForm()">Cancel</button><button class="btn" id="formPrimary" onclick="submitForm()">Add</button></div>
<div id="formExtra"></div>
</div></div>

<div class="modal" id="modal"><div class="modalbox">
<h2 id="modalTitle">Delete?</h2>
<p id="modalText" class="center"></p>
<div class="row"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn danger" id="modalConfirm">Delete</button></div>
</div></div>

<script>
const DB_NAME='ChapterManagerDB', STORE='subjects', LS_FALLBACK='chapterManagerFallbackV1';
let db=null, idbReady=false;
let state={subjects:[], view:'main', subjectId:null, chapterId:null};
function $(id){return document.getElementById(id);}
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDur(min){ if(min<60) return min+'m'; let h=Math.floor(min/60), m=min%60; return m? h+'h '+m+'m' : h+'h'; }
function diffLabel(v){ let o=DIFF_OPTS.find(x=>x.v===v); return o?o.l:v; }
function impLabel(v){ let o=IMP_OPTS.find(x=>x.v===v); return o?o.l:v; }
function notePreview(note){ let first=String(note||'').split('\n')[0].trim(); return first.length>60 ? first.slice(0,60)+'…' : first; }
function findSubject(id){ return state.subjects.find(s=>s.id===id); }
function findChapter(sub, id){ return sub ? sub.chapters.find(c=>c.id===id) : null; }
function openDB(){ return new Promise(res=>{ try{ let req=indexedDB.open(DB_NAME,1); req.onupgradeneeded=e=>{ e.target.result.createObjectStore(STORE,{keyPath:'id'}); }; req.onsuccess=e=>{ db=e.target.result; idbReady=true; res(true); }; req.onerror=()=>{ idbReady=false; res(false); }; }catch(e){ idbReady=false; res(false); } }); }
function idbAll(){ return new Promise(res=>{ let tx=db.transaction(STORE,'readonly'); let req=tx.objectStore(STORE).getAll(); req.onsuccess=()=>res(req.result||[]); req.onerror=()=>res([]); }); }
function idbPut(sub){ return new Promise(res=>{ let tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(sub); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
function idbDel(id){ return new Promise(res=>{ let tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
async function loadAll(){
await openDB();
if(idbReady){ state.subjects=await idbAll(); }
else { try{ state.subjects=JSON.parse(localStorage.getItem(LS_FALLBACK)||'[]'); }catch(e){ state.subjects=[]; } }
let migrated=false;
state.subjects.forEach(sub=>{
sub.chapters=sub.chapters||[];
sub.chapters.forEach(ch=>{
if(!ch.difficulty){ ch.difficulty='medium'; migrated=true; }
if(!ch.importance){ ch.importance='important'; migrated=true; }
ch.topics=(ch.topics||[]).map(t=>({difficulty:'medium', importance:'important', note:'', ...t, note:(t.note||'')}));
});
});
if(migrated && idbReady){ for(let sub of state.subjects) await idbPut(sub); }
render();
}
async function saveSubject(sub){
if(idbReady){ await idbPut(sub); }
else { try{ localStorage.setItem(LS_FALLBACK, JSON.stringify(state.subjects)); }catch(e){} }
}
async function deleteSubjectFromStore(id){
if(idbReady){ await idbDel(id); }
else { try{ localStorage.setItem(LS_FALLBACK, JSON.stringify(state.subjects)); }catch(e){} }
}
let toastTimer=null;
function showToast(msg){ let t=$('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function closeAllDropdowns(){ document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')); }
const DIFF_OPTS=[{v:'easy',l:'Easy'},{v:'medium',l:'Medium'},{v:'hard',l:'Hard'}];
const IMP_OPTS=[{v:'less',l:'Less important'},{v:'important',l:'Important'},{v:'very',l:'Very important'}];
const DUR_OPTS=[{v:'60',l:'1 hour'},{v:'90',l:'1 hour 30 minutes'},{v:'120',l:'2 hours'},{v:'custom',l:'Custom…'}];
function ddHTML(kind, value, opts, extra, btnClass){
let cur=opts.find(o=>String(o.v)===String(value))||opts[0];
let menu=opts.map(o=>'<button type="button" class="dd-opt" data-value="'+o.v+'"><span>'+o.l+'</span><span class="tick">'+(String(o.v)===String(value)?'✓':'')+'</span></button>').join('');
return '<div class="dd" data-kind="'+kind+'" data-value="'+value+'" '+extra+'><button type="button" class="'+btnClass+'"><span class="dd-label">'+cur.l+'</span><span class="chev-css"></span></button><div class="dd-menu">'+menu+'</div></div>';
}
function durDDHTML(kind, value, id){
let v=[60,90,120].includes(value)?String(value):'custom';
return ddHTML(kind, v, DUR_OPTS, 'id="'+id+'"', 'dd-btn');
}
</script>

<script>
/* Custom dropdown handling — one delegation for every dropdown on every page */
document.addEventListener('click', e=>{
let btn=e.target.closest('.dd-btn');
if(btn){ e.stopPropagation(); let dd=btn.closest('.dd'); let was=dd.classList.contains('open'); closeAllDropdowns(); if(!was) dd.classList.add('open'); return; }
let opt=e.target.closest('.dd-opt');
if(opt){
let dd=opt.closest('.dd'); let kind=dd.dataset.kind; let val=opt.dataset.value; let label=opt.querySelector('span').textContent;
dd.dataset.value=val; dd.querySelector('.dd-label').textContent=label;
dd.querySelectorAll('.tick').forEach(t=>t.textContent=''); let tick=opt.querySelector('.tick'); if(tick) tick.textContent='✓';
if(kind==='topic-diff'){ dd.querySelector('.dd-btn').className='dd-btn pill diff-'+val; setTopicField(dd.dataset.subject, dd.dataset.chapter, dd.dataset.topic, 'difficulty', val); }
else if(kind==='topic-imp'){ dd.querySelector('.dd-btn').className='dd-btn pill imp-'+val; setTopicField(dd.dataset.subject, dd.dataset.chapter, dd.dataset.topic, 'importance', val); }
else if(kind==='chapter-diff'){ dd.querySelector('.dd-btn').className='dd-btn pill diff-'+val; setChapterField(dd.dataset.subject, dd.dataset.chapter, 'difficulty', val); }
else if(kind==='chapter-imp'){ dd.querySelector('.dd-btn').className='dd-btn pill imp-'+val; setChapterField(dd.dataset.subject, dd.dataset.chapter, 'importance', val); }
else if(kind==='add-dur'){ let w=$('customDurWrap'); if(w) w.style.display = val==='custom' ? 'block':'none'; }
else if(kind==='edit-dur'){ let w=$('editCustomWrap'); if(w) w.style.display = val==='custom' ? 'block':'none'; }
closeAllDropdowns(); return;
}
if(!e.target.closest('.dd')) closeAllDropdowns();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeAllDropdowns(); closeForm(); } });

/* Delete pop-up (custom) */
let confirmAction=null;
function askDelete(title, text, action){ $('modalTitle').textContent=title; $('modalText').textContent=text; confirmAction=action; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); confirmAction=null; }
$('modalConfirm').onclick=async ()=>{ let a=confirmAction; closeModal(); if(a) await a(); };

/* Form pop-up (custom) — Add Subject / Edit Subject / Add Chapter / Add Topic */
let formSubmit=null;
function openForm(title, bodyHTML, primaryLabel, onSubmit, extraHTML){
$('formTitle').textContent=title; $('formBody').innerHTML=bodyHTML;
$('formPrimary').textContent=primaryLabel; $('formExtra').innerHTML=extraHTML||'';
formSubmit=onSubmit; $('formModal').classList.add('open');
}
function closeForm(){ $('formModal').classList.remove('open'); formSubmit=null; }
$('formModal').addEventListener('click', e=>{ if(e.target===$('formModal')) closeForm(); });
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeModal(); });
function submitForm(){ if(formSubmit) formSubmit(); }

/* Navigation */
function goMain(){ state.view='main'; state.subjectId=null; state.chapterId=null; render(); }
function openSubject(id){ state.view='subject'; state.subjectId=id; state.chapterId=null; render(); window.scrollTo(0,0); }
function openChapter(e, subId, chId){
if(e && e.target.closest('.dd')) return;
if(e && e.target.closest('.del')) return;
state.view='chapter'; state.subjectId=subId; state.chapterId=chId; render(); window.scrollTo(0,0);
}
function goSubject(){ state.view='subject'; state.chapterId=null; render(); window.scrollTo(0,0); }
function fabAction(){
if(state.view==='main') openAddSubject();
else if(state.view==='subject') openAddChapter(state.subjectId);
else if(state.view==='chapter') openAddTopic(state.subjectId, state.chapterId);
}

/* Render */
function render(){
$('viewMain').style.display = state.view==='main' ? 'block':'none';
$('viewSubject').style.display = state.view==='subject' ? 'block':'none';
$('viewChapter').style.display = state.view==='chapter' ? 'block':'none';
if(state.view==='main') renderMain();
else if(state.view==='subject') renderSubject();
else if(state.view==='chapter') renderChapter();
}
function renderMain(){
let w=$('viewMain');
let html='<div style="text-align:left;margin-top:26px"><h2 style="margin:0">Subjects</h2></div>';
if(!state.subjects.length){
html+='<div class="card" style="text-align:center"><p class="empty" style="margin:0">No subjects yet.<br>Tap + below to add your first subject.</p></div>';
} else {
state.subjects.forEach(sub=>{
let totalTopics=sub.chapters.reduce((n,c)=>n+c.topics.length,0);
html+='<div class="subj-tile" onclick="openSubject(\''+sub.id+'\')"><div><h3>'+esc(sub.name)+'</h3>'+(sub.code?'<span class="codepill">'+esc(sub.code)+'</span>':'')+'<div class="meta">'+sub.chapters.length+' chapter'+(sub.chapters.length===1?'':'s')+' · '+totalTopics+' topic'+(totalTopics===1?'':'s')+'</div></div><span class="chev">›</span></div>';
});
}
w.innerHTML=html;
}
function renderSubject(){
let sub=findSubject(state.subjectId); if(!sub){ goMain(); return; }
let totalTopics=sub.chapters.reduce((n,c)=>n+c.topics.length,0);
let html='<div style="text-align:left"><button class="back" onclick="goMain()">‹ Subjects</button></div>'
+'<div class="pagehead"><h2>'+esc(sub.name)+'</h2>'+(sub.code?'<span class="codepill">'+esc(sub.code)+'</span>':'')
+'<button class="editbtn" onclick="openEditSubject(\''+sub.id+'\')" aria-label="Edit subject"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button></div>'
+'<div class="overview"><div class="stat"><b>'+fmtDur(sub.durationMin)+'</b><span>Time</span></div><div class="stat"><b>'+sub.maxMarks+'</b><span>Marks</span></div><div class="stat"><b>'+sub.chapters.length+'</b><span>Chapters</span></div><div class="stat"><b>'+totalTopics+'</b><span>Topics</span></div></div>'
+'<div class="section-label">Chapters</div>';
if(!sub.chapters.length){
html+='<div class="card" style="text-align:center"><p class="empty" style="margin:0">No chapters yet.<br>Tap + below to add your first chapter.</p></div>';
} else {
sub.chapters.forEach(ch=>{
html+='<div class="chapter-row" onclick="openChapter(event,\''+sub.id+'\',\''+ch.id+'\')"><h4>'+esc(ch.name)+'</h4>'
+'<div class="chapter-meta"><span class="pill diff-'+ch.difficulty+'">'+diffLabel(ch.difficulty)+'</span><span class="pill imp-'+ch.importance+'">'+impLabel(ch.importance)+'</span><span class="count">'+ch.topics.length+' topic'+(ch.topics.length===1?'':'s')+'</span></div></div>';
});
}
$('viewSubject').innerHTML=html;
}
function topicRowHTML(sub, ch, t){
let preview=notePreview(t.note);
return '<div class="topic" data-topic="'+t.id+'" data-chapter="'+ch.id+'" data-subject="'+sub.id+'" onclick="openTopicPopup(event,\''+sub.id+'\',\''+ch.id+'\',\''+t.id+'\')">'
+'<span class="handle" data-drag="'+t.id+'" title="Drag to reorder">⠿</span>'
+'<div class="topic-main"><div class="name">'+esc(t.name)+'</div>'
+'<div class="topic-meta"><span class="pill diff-'+t.difficulty+'">'+diffLabel(t.difficulty)+'</span><span class="pill imp-'+t.importance+'">'+impLabel(t.importance)+'</span>'+(preview?'<span class="note-preview">'+esc(preview)+'</span>':'')+'</div></div></div>';
}
function renderChapter(){
let sub=findSubject(state.subjectId); let ch=sub ? findChapter(sub, state.chapterId) : null;
if(!sub || !ch){ goMain(); return; }
let html='<div style="text-align:left"><button class="back" onclick="goSubject()">‹ '+esc(sub.name)+'</button></div>'
+'<div class="pagehead"><h2>'+esc(ch.name)+'</h2>'
+'<button class="editbtn" onclick="openEditChapter(\''+sub.id+'\',\''+ch.id+'\')" aria-label="Edit chapter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button></div>'
+'<div class="chapter-meta" style="justify-content:center;margin-top:12px"><span class="pill diff-'+ch.difficulty+'">'+diffLabel(ch.difficulty)+'</span><span class="pill imp-'+ch.importance+'">'+impLabel(ch.importance)+'</span><span class="count">'+ch.topics.length+' topic'+(ch.topics.length===1?'':'s')+'</span></div>'
+'<div class="section-label">Topics</div>';
if(!ch.topics.length){
html+='<div class="card" style="text-align:center"><p class="empty" style="margin:0">No topics yet.<br>Tap + below to add your first topic.</p></div>';
} else {
html+='<div data-chapter-list="'+ch.id+'">'+ch.topics.map(t=>topicRowHTML(sub,ch,t)).join('')+'</div>';
}
html+='<div style="margin-top:22px"><button class="btn" onclick="saveChapterPDF(\''+sub.id+'\',\''+ch.id+'\')">Save as PDF</button></div>'
+'<div style="margin-top:16px;text-align:center"><button class="smallbtn danger" onclick="deleteChapter(\''+sub.id+'\',\''+ch.id+'\')">Delete chapter</button></div>';
$('viewChapter').innerHTML=html;
bindDrag();
}

/* Drag and drop — topics only, pointer-based, mouse and touch */
let drag=null, dragJustEnded=false;
function bindDrag(){
document.querySelectorAll('.handle').forEach(h=>{
h.addEventListener('pointerdown', e=>{
e.preventDefault();
let row=h.closest('.topic'); if(!row) return;
let list=row.parentElement;
drag={row:row, list:list, startY:e.clientY, subject:row.dataset.subject, chapter:row.dataset.chapter};
row.classList.add('dragging'); row.style.transform='translateY(0px)';
try{ h.setPointerCapture(e.pointerId); }catch(err){}
h.addEventListener('pointermove', onDragMove);
h.addEventListener('pointerup', onDragEnd, {once:true});
h.addEventListener('pointercancel', onDragEnd, {once:true});
});
});
}
function onDragMove(e){
if(!drag) return;
let dy=e.clientY-drag.startY; drag.row.style.transform='translateY('+dy+'px)';
let rows=[...drag.list.querySelectorAll('.topic')].filter(r=>r!==drag.row);
rows.forEach(r=>r.classList.remove('drop-before','drop-after'));
let target=null, before=true;
for(let r of rows){ let rect=r.getBoundingClientRect(); let mid=rect.top+rect.height/2; if(e.clientY<mid){ target=r; before=true; break; } target=r; before=false; }
if(target){ if(before){ drag.list.insertBefore(drag.row, target); target.classList.add('drop-before'); } else { drag.list.insertBefore(drag.row, target.nextSibling); target.classList.add('drop-after'); } }
}
async function onDragEnd(){
if(!drag) return;
let d=drag; drag=null;
d.row.classList.remove('dragging'); d.row.style.transform='';
d.list.querySelectorAll('.topic').forEach(r=>r.classList.remove('drop-before','drop-after'));
dragJustEnded=true; setTimeout(()=>{ dragJustEnded=false; }, 200);
let order=[...d.list.querySelectorAll('.topic')].map(r=>r.dataset.topic);
let sub=findSubject(d.subject); if(!sub) return; let ch=sub.chapters.find(c=>c.id===d.chapter); if(!ch) return;
let byId={}; ch.topics.forEach(t=>byId[t.id]=t); ch.topics=order.map(id=>byId[id]).filter(Boolean);
await saveSubject(sub); render();
}
</script>

<script>
/* Field changes from dropdowns */
async function setChapterField(subjectId, chapterId, field, value){
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
ch[field]=value; await saveSubject(sub);
}
async function setTopicField(subjectId, chapterId, topicId, field, value){
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
let t=ch.topics.find(x=>x.id===topicId); if(!t) return;
t[field]=value; await saveSubject(sub);
}

/* Pop-ups */
function durationFields(kind, id, value, customValue){
let isCustom=![60,90,120].includes(value);
return '<label>Duration</label>'+durDDHTML(kind, value, id)
+'<div id="'+(kind==='edit-dur'?'editCustomWrap':'customDurWrap')+'" style="display:'+(isCustom?'block':'none')+'"><label>Custom duration — minutes</label><input type="number" id="'+(kind==='edit-dur'?'editCustomMin':'customMin')+'" value="'+(isCustom?value:'')+'" placeholder="e.g. 30 or 45" min="5" max="600" inputmode="numeric"></div>';
}
function readDuration(kind, id){
let dd=$(id); let val=dd ? dd.dataset.value : '120';
if(val==='custom'){ let inp=$(kind==='edit-dur'?'editCustomMin':'customMin'); return parseInt(inp.value,10); }
return parseInt(val,10);
}
function openAddSubject(){
openForm('Add Subject',
'<label>Subject name</label><input type="text" id="fName" placeholder="e.g. Quantitative Techniques" autocomplete="off">'
+'<label>Subject code</label><input type="text" id="fCode" placeholder="e.g. MG3CCRBCA200" autocomplete="off">'
+durationFields('add-dur', 'durDD', 120, '')
+'<label>Maximum marks</label><input type="number" id="fMarks" placeholder="e.g. 70" min="1" inputmode="numeric">',
'Add subject', async ()=>{
let name=$('fName').value.trim(); let code=$('fCode').value.trim();
let marks=parseInt($('fMarks').value,10); let min=readDuration('add-dur','durDD');
if(!name){ showToast('Add a subject name first.'); $('fName').focus(); return; }
if(!marks || marks<=0){ showToast('Add the maximum marks, e.g. 70.'); $('fMarks').focus(); return; }
if(!min || min<=0){ showToast('Choose a duration, or type custom minutes.'); return; }
state.subjects.push({id:uid(), name:name, code:code, durationMin:min, maxMarks:marks, chapters:[]});
await saveSubject(state.subjects[state.subjects.length-1]);
closeForm(); showToast('Subject added.'); render();
});
setTimeout(()=>{ let n=$('fName'); if(n) n.focus(); }, 50);
}
function openEditSubject(id){
let sub=findSubject(id); if(!sub) return;
openForm('Edit Subject',
'<label>Subject name</label><input type="text" id="fName" value="'+esc(sub.name)+'" autocomplete="off">'
+'<label>Subject code</label><input type="text" id="fCode" value="'+esc(sub.code)+'" autocomplete="off">'
+durationFields('edit-dur', 'editDurDD', sub.durationMin, '')
+'<label>Maximum marks</label><input type="number" id="fMarks" value="'+sub.maxMarks+'" min="1" inputmode="numeric">',
'Save', async ()=>{
let name=$('fName').value.trim(); let code=$('fCode').value.trim();
let marks=parseInt($('fMarks').value,10); let min=readDuration('edit-dur','editDurDD');
if(!name || !marks || marks<=0 || !min || min<=0){ showToast('Fill in name, maximum marks and duration.'); return; }
sub.name=name; sub.code=code; sub.maxMarks=marks; sub.durationMin=min;
await saveSubject(sub); closeForm(); showToast('Subject saved.'); render();
},
'<div style="margin-top:16px;text-align:center"><button class="smallbtn danger" onclick="closeForm();deleteSubject(\''+sub.id+'\')">Delete subject</button></div>');
}
function openAddChapter(subjectId){
let sub=findSubject(subjectId); if(!sub) return;
openForm('Add Chapter',
'<label>Chapter name</label><input type="text" id="fChName" placeholder="e.g. Module 1 — Introduction" autocomplete="off">'
+'<label>Difficulty</label>'+ddHTML('addchapter-diff', 'medium', DIFF_OPTS, 'id="addChDiff"', 'dd-btn')
+'<label>Importance</label>'+ddHTML('addchapter-imp', 'important', IMP_OPTS, 'id="addChImp"', 'dd-btn'),
'Add chapter', async ()=>{
let name=$('fChName').value.trim();
if(!name){ showToast('Add a chapter name first.'); $('fChName').focus(); return; }
let diff=$('addChDiff').dataset.value, imp=$('addChImp').dataset.value;
sub.chapters.push({id:uid(), name:name, difficulty:diff, importance:imp, topics:[]});
await saveSubject(sub); closeForm(); showToast('Chapter added.'); render();
});
setTimeout(()=>{ let n=$('fChName'); if(n) n.focus(); }, 50);
}
function openAddTopic(subjectId, chapterId){
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
openForm('Add Topic',
'<label>Topic name</label><input type="text" id="fTopicName" placeholder="Add a topic" autocomplete="off">'
+'<label>Difficulty</label>'+ddHTML('addtopic-diff', 'medium', DIFF_OPTS, 'id="addTopicDiff"', 'dd-btn')
+'<label>Importance</label>'+ddHTML('addtopic-imp', 'important', IMP_OPTS, 'id="addTopicImp"', 'dd-btn')
+'<label>Note</label><textarea id="fTopicNote" placeholder="Add a note for this topic (optional)"></textarea>',
'Add topic', async ()=>{
let name=$('fTopicName').value.trim();
if(!name){ showToast('Add a topic name first.'); $('fTopicName').focus(); return; }
let diff=$('addTopicDiff').dataset.value, imp=$('addTopicImp').dataset.value;
ch.topics.push({id:uid(), name:name, difficulty:diff, importance:imp, note:$('fTopicNote').value});
await saveSubject(sub); closeForm(); showToast('Topic added.'); render();
});
setTimeout(()=>{ let n=$('fTopicName'); if(n) n.focus(); }, 50);
}


/* Topic pop-up — tap a topic to see it. Difficulty / importance are fixed here;
   only Edit topic can change them. */
function openTopicPopup(e, subjectId, chapterId, topicId){
if(e && e.target.closest('.handle')) return;
if(dragJustEnded) return;
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
let t=ch.topics.find(x=>x.id===topicId); if(!t) return;
openForm(t.name,
'<div class="chapter-meta" style="justify-content:center;margin-top:0"><span class="pill diff-'+t.difficulty+'">'+diffLabel(t.difficulty)+'</span><span class="pill imp-'+t.importance+'">'+impLabel(t.importance)+'</span></div>'
+'<label>Note</label>'
+(t.note ? '<div class="view-note">'+esc(t.note)+'</div>' : '<p class="empty" style="margin:6px 0 0">No note yet. Tap Edit topic to add one.</p>'),
'Edit topic', ()=>{ openEditTopic(subjectId, chapterId, topicId); });
}
function openEditTopic(subjectId, chapterId, topicId){
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
let t=ch.topics.find(x=>x.id===topicId); if(!t) return;
openForm('Edit Topic',
'<label>Topic name</label><input type="text" id="fTopicName" value="'+esc(t.name)+'" autocomplete="off">'
+'<label>Difficulty</label>'+ddHTML('edittopic-diff', t.difficulty, DIFF_OPTS, 'id="editTopicDiff"', 'dd-btn')
+'<label>Importance</label>'+ddHTML('edittopic-imp', t.importance, IMP_OPTS, 'id="editTopicImp"', 'dd-btn')
+'<label>Note</label><textarea id="fTopicNote" placeholder="Add a note for this topic">'+esc(t.note||'')+'</textarea>',
'Save', async ()=>{
let name=$('fTopicName').value.trim();
if(!name){ showToast('Add a topic name first.'); $('fTopicName').focus(); return; }
t.name=name; t.difficulty=$('editTopicDiff').dataset.value; t.importance=$('editTopicImp').dataset.value; t.note=$('fTopicNote').value;
await saveSubject(sub); closeForm(); showToast('Topic saved.'); render();
},
'<div style="margin-top:16px;text-align:center"><button class="smallbtn danger" onclick="closeForm();deleteTopic(\''+sub.id+'\',\''+ch.id+'\',\''+t.id+'\')">Delete topic</button></div>');
}
function openEditChapter(subjectId, chapterId){
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
openForm('Edit Chapter',
'<label>Chapter name</label><input type="text" id="fChName" value="'+esc(ch.name)+'" autocomplete="off">'
+'<label>Difficulty</label>'+ddHTML('editchapter-diff', ch.difficulty, DIFF_OPTS, 'id="editChDiff"', 'dd-btn')
+'<label>Importance</label>'+ddHTML('editchapter-imp', ch.importance, IMP_OPTS, 'id="editChImp"', 'dd-btn'),
'Save', async ()=>{
let name=$('fChName').value.trim();
if(!name){ showToast('Add a chapter name first.'); $('fChName').focus(); return; }
ch.name=name; ch.difficulty=$('editChDiff').dataset.value; ch.importance=$('editChImp').dataset.value;
await saveSubject(sub); closeForm(); showToast('Chapter saved.'); render();
});
}

/* Deletes — always with confirmation */
function deleteSubject(id){
let sub=findSubject(id); if(!sub) return;
askDelete('Delete subject?', '"'+sub.name+'" and all its chapters and topics will be removed.', async ()=>{
state.subjects=state.subjects.filter(s=>s.id!==id);
await deleteSubjectFromStore(id);
if(state.subjectId===id) goMain(); else render();
showToast('Subject deleted.');
});
}
function deleteChapter(subjectId, chapterId){
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
askDelete('Delete chapter?', '"'+ch.name+'" and all its topics will be removed.', async ()=>{
sub.chapters=sub.chapters.filter(c=>c.id!==chapterId);
await saveSubject(sub);
if(state.chapterId===chapterId) goSubject(); else render();
showToast('Chapter deleted.');
});
}
function deleteTopic(subjectId, chapterId, topicId){
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
let t=ch.topics.find(x=>x.id===topicId); if(!t) return;
askDelete('Delete topic?', '"'+t.name+'" will be removed.', async ()=>{
ch.topics=ch.topics.filter(x=>x.id!==topicId);
await saveSubject(sub); render(); showToast('Topic deleted.');
});
}


/* Save a chapter as PDF — via the print sheet, so pages flow and nothing is cut */
function saveChapterPDF(subjectId, chapterId){
let sub=findSubject(subjectId); if(!sub) return; let ch=findChapter(sub, chapterId); if(!ch) return;
let html='<div class="print-chapter"><h1>'+esc(ch.name)+'</h1>'
+'<p class="pline">'+esc(sub.name)+'</p>'
+'<p class="pline">'+esc(sub.code)+'</p>'
+'<p class="pline">Difficulty: '+diffLabel(ch.difficulty)+'</p>'
+'<p class="pline">Importance: '+impLabel(ch.importance)+'</p>';
ch.topics.forEach((t,i)=>{
html+='<div class="print-topic"><h3>'+(i+1)+'. '+esc(t.name)+'</h3>'
+'<div class="pmeta">Difficulty: '+diffLabel(t.difficulty)+' · Importance: '+impLabel(t.importance)+'</div>'
+(t.note ? '<div class="pnote">'+esc(t.note)+'</div>' : '<div class="pmeta" style="margin-top:6px">No notes.</div>')
+'</div>';
});
html+='</div>';
$('printArea').innerHTML=html;
window.print();
}
