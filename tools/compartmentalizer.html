<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<script>
/* Theme before first paint — dark follows the phone on first visit, saved choice after that. */
try{ let t=localStorage.getItem('compartmentalizerTheme'); if(t==='dark' || (t!=='light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)){ document.documentElement.classList.add('dark'); } }catch(e){}
</script>
<title>Compartmentalizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* UNIVERSAL RULE — no blue overlay, ever. No blue tap highlight, no blue focus ring. Focus is a neutral grey border only. */
*{-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}
*:focus{outline:none!important}
*:focus-visible{outline:none!important;box-shadow:none!important}
input:focus,textarea:focus,button:focus{outline:none!important;box-shadow:none!important;border-color:#a1a1a6!important}
::selection{background:#e5e5ea;color:#1d1d1f}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;-webkit-font-smoothing:antialiased;padding-bottom:64px}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 110px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#86868b;font-weight:600}
h1{font-size:40px;line-height:1.05;letter-spacing:-.03em;margin:10px 0 8px;font-weight:800}
.sub{color:#86868b;font-size:15px;margin:0}
.saved{font-size:12px;color:#86868b;margin-top:10px}
.saved b{color:#1d1d1f}
.card{background:#fff;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);text-align:left}
h2{font-size:17px;letter-spacing:-.01em;margin:0 0 14px;font-weight:700}
label{display:block;font-size:12px;font-weight:600;color:#86868b;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px;text-align:left}
input[type=text],input[type=number],input[type=search]{width:100%;background:#f5f5f7;border:1px solid #e2e2e7;color:#1d1d1f;border-radius:12px;padding:13px 14px;font-size:15px;font-family:Inter,sans-serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}h1{font-size:32px}}
.btn{border:0;border-radius:12px;padding:15px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#1d1d1f;color:#fff;font-family:Inter,sans-serif;width:100%}
.btn.sec{background:#f5f5f7;color:#1d1d1f;border:1px solid #e2e2e7}
.btn.danger{background:#fff;color:#c81e1e;border:1px solid #f0c6c6}
.btn:active{transform:scale(.99)}
.smallbtn{border:1px solid #e2e2e7;background:#fff;color:#1d1d1f;border-radius:999px;padding:11px 16px;min-height:44px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif}
.smallbtn.danger{color:#c81e1e;border-color:#f0c6c6}
.back{border:0;background:transparent;color:#0071e3;font-size:15px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;padding:10px 0;min-height:44px;text-align:left}
.codepill{display:inline-block;background:#f5f5f7;border:1px solid #e2e2e7;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:#6e6e73;margin-top:6px}
/* Subject tiles — full-width, lengthwise */
.subj-tile{background:#fff;border-radius:20px;padding:20px 22px;margin-top:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:left;transition:transform .15s ease,box-shadow .15s ease}
.subj-tile:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.subj-tile h3{margin:0;font-size:19px;letter-spacing:-.02em}
.subj-tile .meta{font-size:12px;color:#86868b;margin-top:5px;font-weight:600}
.chev{font-size:20px;color:#86868b;flex-shrink:0}
/* Subject / chapter page header */
.pagehead{position:relative;text-align:center;padding:8px 44px 0}
.pagehead h2{font-size:28px;letter-spacing:-.02em;margin:0}
header{position:relative}
.themebtn{position:absolute;top:0;right:0;width:44px;height:44px;border-radius:50%;border:1px solid #e2e2e7;background:#fff;color:#1d1d1f;cursor:pointer;display:grid;place-items:center;font-family:Inter,sans-serif}
.themebtn svg{width:20px;height:20px}
.themebtn .sun{display:none}
.editbtn{position:absolute;top:0;right:0;width:44px;height:44px;border-radius:50%;border:1px solid #e2e2e7;background:#fff;color:#1d1d1f;cursor:pointer;display:grid;place-items:center;font-family:Inter,sans-serif}
.editbtn svg{width:17px;height:17px}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
@media(max-width:560px){.overview{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid #e8e8ed;border-radius:16px;padding:14px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:#86868b;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
/* Chapter rows */
.chapter-row{background:#fff;border-radius:20px;padding:18px 20px;margin-top:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;text-align:left}
.chapter-row h4{margin:0;font-size:18px;line-height:1.35}
.chapter-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.chapter-meta .count{font-size:12px;color:#86868b;font-weight:600}
.pill{font-size:12px;font-weight:600;color:#1d1d1f;background:#f5f5f7;border:1px solid #e2e2e7;border-radius:999px;padding:5px 10px}
.pill.diff-easy{color:#137333}
.pill.diff-hard{color:#c81e1e}
.pill.imp-very{color:#7c2d12;font-weight:700}
textarea{width:100%;background:#f5f5f7;border:1px solid #e2e2e7;color:#1d1d1f;border-radius:12px;padding:13px 14px;font-size:15px;font-family:Inter,sans-serif;min-height:96px;resize:vertical}
.view-note{background:#f5f5f7;border:1px solid #e2e2e7;border-radius:12px;padding:13px 14px;font-size:15px;line-height:1.6;text-align:left;white-space:pre-wrap;margin-top:6px}
.topic-main{flex:1;min-width:0;text-align:left}
.topic-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.note-preview{font-size:12px;color:#86868b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.section-label{font-size:12px;font-weight:600;color:#86868b;letter-spacing:.06em;text-transform:uppercase;text-align:left;margin:26px 0 0}
/* Topics */
.topic{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #e2e2e7;border-radius:14px;padding:9px 10px;margin-top:8px;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}
.topic.dragging{opacity:.92;box-shadow:0 12px 28px rgba(0,0,0,.18);z-index:5;position:relative;transition:none}
.topic.drop-before{border-top:2px solid #1d1d1f}
.topic.drop-after{border-bottom:2px solid #1d1d1f}
.handle{touch-action:none;cursor:grab;color:#a1a1a6;font-size:18px;padding:10px 8px;min-height:44px;display:flex;align-items:center;flex-shrink:0;user-select:none;-webkit-user-select:none}
.handle:active{cursor:grabbing}
.topic .name{font-size:15px;font-weight:600;text-align:left;line-height:1.4}
.del{border:0;background:transparent;color:#c81e1e;font-size:18px;cursor:pointer;padding:10px 12px;min-height:44px;flex-shrink:0}
/* Chapter tabs — Topics / Questions capsule */
.tabs{display:flex;gap:3px;background:#e8e8ed;border-radius:12px;padding:3px;margin-top:20px}
.tab{flex:1;border:0;background:transparent;color:#6e6e73;padding:12px 8px;min-height:44px;border-radius:9px;font-weight:600;font-size:15px;cursor:pointer;font-family:Inter,sans-serif;transition:background .2s ease,color .2s ease,box-shadow .2s ease}
.tab.on{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab:active{transform:scale(.98)}
.listfade{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* Questions */
.qrow{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #e2e2e7;border-radius:14px;padding:12px 14px;margin-top:8px;cursor:pointer;text-align:left;transition:transform .15s ease,box-shadow .15s ease}
.qrow:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.qrow:active{transform:scale(.99)}
/* Marks distribution (Add / Edit Subject) */
.dist-part{background:#f5f5f7;border:1px solid #e8e8ed;border-radius:14px;padding:14px;margin-top:10px}
.dist-head{font-weight:700;font-size:14px;text-align:left}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 label{margin:8px 0 4px;font-size:11px}
.grid3 input{padding:10px 12px}
.dist-err{color:#c81e1e;font-size:13px;font-weight:600;margin-top:10px;display:none;text-align:left}
.distline{font-size:13px;color:#86868b;font-weight:600;margin-top:14px;text-align:center}
/* PDF options — Apple switches */
.optrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e8e8ed;text-align:left}
.optrow:last-child{border-bottom:0}
.optrow b{display:block;font-size:15px}
.optrow span{font-size:13px;color:#86868b}
.optrow.sub{padding-left:16px}
.optrow.off{opacity:.45}
.optrow.off .switch{pointer-events:none}
.switch{flex:none;width:52px;height:32px;border-radius:999px;border:0;background:#e2e2e7;cursor:pointer;position:relative;transition:background .2s ease;padding:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s ease}
.switch.on{background:#34c759}
.switch.on::after{transform:translateX(20px)}
.switch:active::after{width:32px}
/* FAB — one + button, bottom-right, action follows the page */
.fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:#1d1d1f;color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.22);z-index:40}
.fab:active{transform:scale(.96)}
body.home-view{padding-bottom:118px}
body.home-view .fab{bottom:122px}
.empty{color:#86868b;font-size:14px}
/* Custom pop-ups — blurred backdrop, scale-in */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.modalbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:420px;text-align:left;animation:popin .22s ease;max-height:88vh;overflow-y:auto}
@keyframes popin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modalbox h2{font-size:21px;text-align:center}
.modalbox p{color:#86868b;font-size:14px;line-height:1.6}
.modalbox .center{text-align:center}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
/* Custom dropdowns — no native select anywhere. Custom CSS chevron, no text arrow. */
.dd{position:relative}
.dd-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:#f5f5f7;border:1px solid #e2e2e7;color:#1d1d1f;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;text-align:left}
.dd-btn.pill{width:auto;padding:8px 11px;font-size:12px;border-radius:999px;background:#fff;min-width:118px}
.chev-css{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s ease;flex-shrink:0;margin-top:-3px}
.dd.open .chev-css{transform:rotate(225deg);margin-top:2px}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:180px;background:#fff;border:1px solid #e2e2e7;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.16);padding:6px;display:none;z-index:30;animation:dropin .18s ease}
.dd.open .dd-menu{display:block}
@keyframes dropin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.dd-opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:#1d1d1f;padding:13px 12px;min-height:44px;border-radius:9px;font-size:14px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;text-align:left}
.dd-opt:hover{background:#f5f5f7}
.dd-opt .tick{color:#1d1d1f;font-weight:800}
.dd-btn.diff-easy{color:#137333}
.dd-btn.diff-hard{color:#c81e1e}
.dd-btn.imp-very{color:#7c2d12;font-weight:700}
/* Custom toast — no native alert anywhere */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:28px;background:#1d1d1f;color:#fff;padding:13px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 12px 32px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.has-undo{pointer-events:auto}
#toast .undo-btn{border:0;background:transparent;color:#64d2ff;font-weight:800;font-size:14px;cursor:pointer;font-family:Inter,sans-serif;margin-left:12px;padding:6px 4px}
#toast .undo-btn:active{transform:scale(.96)}
/* Search + backup card — home page */
.searchwrap{margin-top:20px}
.searchwrap input{margin:0}
.mut{color:#86868b;font-size:13px;line-height:1.5}

/* Save as PDF — print only. Flowing pages, topics kept whole, footer repeats on every page. */
#printArea{display:none}
#printFooter{display:none}
@media print{
@page{size:A4;margin:18mm 16mm 22mm 16mm}
html,body{background:#fff}
.wrap,.fab,#toast,.modal{display:none!important}
#printArea{display:block!important;text-align:left;color:#1d1d1f}
#printFooter{display:flex!important;position:fixed;bottom:0;left:0;right:0;justify-content:space-between;align-items:center;font-size:11px;color:#6e6e73;border-top:1px solid #d2d2d7;padding-top:8px;background:#fff}
#printFooter a{color:#1d1d1f;text-decoration:none;font-weight:600}
#printFooter svg{width:16px;height:16px}
}
.print-chapter h1{font-size:26px;text-align:center;margin:0 0 6px}
.print-chapter .pline{text-align:center;color:#6e6e73;font-size:14px;margin:3px 0}
.print-topic{break-inside:avoid;page-break-inside:avoid;margin-top:18px}
.print-topic h3{font-size:16px;margin:0 0 4px}
.print-topic .pmeta{font-size:12px;color:#6e6e73;font-weight:600}
.print-topic .pnote{font-size:14px;line-height:1.65;white-space:pre-wrap;margin-top:8px}


/* Resources */
.res-url{font-size:12px;color:#86868b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin-top:6px}
.linkbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid #e2e2e7;background:#f5f5f7;color:#1d1d1f;cursor:pointer;display:grid;place-items:center;font-family:Inter,sans-serif}
.linkbtn svg{width:18px;height:18px}
.linkbtn:active{transform:scale(.94)}
.embed-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:10px}
.embed-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed-page{width:100%;height:340px;border:1px solid #e2e2e7;border-radius:12px;margin-top:10px;background:#fff}
.res-open{margin-top:14px}
.print-topic a{color:#1d1d1f}

/* Optional subject fields — toggle off darkens and fades the field */
.opthead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.opthead label{margin:0}
.optfield.off{opacity:.45}
.optfield.off input,.optfield.off textarea,.optfield.off .dd{pointer-events:none}

/* Reduced motion — the phone's setting wins over the animations */
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* Dark mode — follows the phone on first visit, toggle in the header, saved in this browser */
html.dark body{background:#000;color:#f5f5f7}
html.dark .card,html.dark .subj-tile,html.dark .chapter-row,html.dark .topic,html.dark .qrow,html.dark .stat,html.dark .modalbox,html.dark .dd-menu,html.dark .dd-btn.pill,html.dark .editbtn,html.dark .smallbtn,html.dark .linkbtn,html.dark .explore,html.dark .site-footer,html.dark .embed-page{background:#1c1c1e;border-color:#38383a;color:#f5f5f7}
html.dark .dd-btn,html.dark input[type=text],html.dark input[type=number],html.dark input[type=search],html.dark textarea,html.dark .view-note,html.dark .pill,html.dark .codepill,html.dark .dist-part{background:#2c2c2e;border-color:#38383a;color:#f5f5f7}
html.dark .saved,html.dark .sub,html.dark .eyebrow,html.dark .empty,html.dark .mut,html.dark .stat span,html.dark .subj-tile .meta,html.dark .chapter-meta .count,html.dark .note-preview,html.dark .res-url,html.dark .optrow span,html.dark .modalbox p,html.dark .distline,html.dark .section-label,html.dark .site-footer,html.dark .chev,html.dark label{color:#98989d}
html.dark .saved b,html.dark .site-footer b,html.dark .site-footer a{color:#f5f5f7}
html.dark .tabs{background:#2c2c2e}
html.dark .tab{color:#98989d}
html.dark .tab.on{background:#48484a;color:#f5f5f7}
html.dark .btn{background:#f5f5f7;color:#1d1d1f}
html.dark .btn.sec{background:#2c2c2e;color:#f5f5f7;border-color:#38383a}
html.dark .btn.danger{background:#1c1c1e;color:#ff6961;border-color:#5c2b29}
html.dark .smallbtn.danger{color:#ff6961;border-color:#5c2b29}
html.dark .fab{background:#f5f5f7;color:#1d1d1f}
html.dark #toast{background:#f5f5f7;color:#1d1d1f}
html.dark .switch{background:#48484a}
html.dark .switch.on{background:#34c759}
html.dark .optrow{border-color:#38383a}
html.dark .explore,html.dark .site-footer{border-top-color:#38383a}
html.dark .explore span:last-child{color:#0a84ff}
html.dark .back{color:#0a84ff}
html.dark .dd-opt:hover{background:#2c2c2e}
html.dark .dd-opt .tick{color:#f5f5f7}
html.dark .topic.drop-before{border-top-color:#f5f5f7}
html.dark .topic.drop-after{border-bottom-color:#f5f5f7}
html.dark .dist-err{color:#ff6961}
html.dark .del{color:#ff6961}
html.dark .pill.diff-easy,html.dark .dd-btn.diff-easy{color:#4ade80}
html.dark .pill.diff-hard,html.dark .dd-btn.diff-hard{color:#ff6961}
html.dark .pill.imp-very,html.dark .dd-btn.imp-very{color:#fda4af}
html.dark ::selection{background:#48484a;color:#f5f5f7}
html.dark .themebtn{border-color:#38383a;background:#1c1c1e;color:#f5f5f7}
html.dark .themebtn .moon{display:none}
html.dark .themebtn .sun{display:block}

/* Explore more tools + personal footer — home page only */
.explore{position:fixed;left:0;right:0;bottom:48px;z-index:30;display:flex;justify-content:space-between;align-items:center;background:#fff;border-top:1px solid #d2d2d7;padding:18px 22px;color:#1d1d1f;text-decoration:none;font-weight:700;font-size:16px}
.explore span:last-child{color:#0071e3}
.site-footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #d2d2d7;padding:14px 20px;color:#86868b;font-size:13px;text-align:center}
.site-footer b{color:#1d1d1f}
.site-footer a{color:#1d1d1f;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-left:12px}
.site-footer a svg{width:15px;height:15px}

</style>
</head>
<body>
<div class="wrap">
<header>
<div class="eyebrow">Subject Manager</div>
<h1>Compartmentalizer</h1>
<p class="sub">Subjects, Chapters, Topic</p>
<p class="saved"><b>● Saved in this browser</b></p>
<button class="themebtn" id="themeBtn" onclick="toggleTheme()" aria-label="Switch to dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<div id="viewMain"></div>
<div id="viewSubject" style="display:none"></div>

<script>
const DB_NAME='ChapterManagerDB', STORE='subjects', LS_FALLBACK='chapterManagerFallbackV1';
let db=null, idbReady=false;
let state={subjects:[], view:'main', subjectId:null, chapterId:null, chapterTab:'topics', subjectTab:'chapters', search:''};
function $(id){return document.getElementById(id);}

/* Dark mode — the toggle in the header, saved in this browser. On a first visit
   the phone's own setting is used (see the small script in <head>). */
const THEME_KEY='compartmentalizerTheme';
function applyThemeMeta(){
let dark=document.documentElement.classList.contains('dark');
let m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', dark?'#000000':'#f5f5f7');
let b=$('themeBtn'); if(b) b.setAttribute('aria-label', dark?'Switch to light mode':'Switch to dark mode');
}
function toggleTheme(){
let dark=document.documentElement.classList.toggle('dark');
try{ localStorage.setItem(THEME_KEY, dark?'dark':'light'); }catch(e){}
applyThemeMeta();
}
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDur(min){ if(min<60) return min+'m'; let h=Math.floor(min/60), m=min%60; return m? h+'h '+m+'m' : h+'h'; }
function diffLabel(v){ let o=DIFF_OPTS.find(x=>x.v===v); return o?o.l:v; }
function impLabel(v){ let o=IMP_OPTS.find(x=>x.v===v); return o?o.l:v; }
function notePreview(note){ let first=String(note||'').split('\n')[0].trim(); return first.length>60 ? first.slice(0,60)+'…' : first; }
function findSubject(id){ return state.subjects.find(s=>s.id===id); }
function findChapter(sub, id){ return sub ? sub.chapters.find(c=>c.id===id) : null; }
function topicList(sub, chapterId){
if(chapterId){ let ch=findChapter(sub, chapterId); return ch ? ch.topics : []; }
return sub.topics || (sub.topics=[]);
}
function findTopic(sub, chapterId, topicId){ return topicList(sub, chapterId).find(x=>x.id===topicId); }
function resourceList(sub, chapterId){
if(chapterId){ let ch=findChapter(sub, chapterId); return ch ? (ch.resources||(ch.resources=[])) : []; }
return sub.resources || (sub.resources=[]);
}
function findResource(sub, chapterId, resId){ return resourceList(sub, chapterId).find(x=>x.id===resId); }
function normalizeUrl(u){ u=String(u||'').trim(); if(!u) return ''; if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u='https://'+u; return u; }
function validUrl(u){ return /^https?:\/\/.+\..+/.test(u||''); }
function youtubeId(url){
let m=String(url||'').match(/(?:youtube\.com\/(?:watch\?[^#]*v=|embed\/|v\/|shorts\/|live\/)|youtu\.be\/|youtube-nocookie\.com\/embed\/)([A-Za-z0-9_-]{11})/);
return m?m[1]:null;
}
function shortUrl(u){ let s=String(u||'').replace(/^https?:\/\//,'').replace(/^www\./,''); return s.length>44 ? s.slice(0,44)+'…' : s; }
function openResourceLink(e, subjectId, chapterId, resId){
if(e) e.stopPropagation();
let sub=findSubject(subjectId); if(!sub) return;
let r=findResource(sub, chapterId, resId); if(!r || !r.url) return;
window.open(r.url, '_blank', 'noopener');
}
function openDB(){ return new Promise(res=>{ try{ let req=indexedDB.open(DB_NAME,1); req.onupgradeneeded=e=>{ e.target.result.createObjectStore(STORE,{keyPath:'id'}); }; req.onsuccess=e=>{ db=e.target.result; idbReady=true; res(true); }; req.onerror=()=>{ idbReady=false; res(false); }; }catch(e){ idbReady=false; res(false); } }); }
function idbAll(){ return new Promise(res=>{ let tx=db.transaction(STORE,'readonly'); let req=tx.objectStore(STORE).getAll(); req.onsuccess=()=>res(req.result||[]); req.onerror=()=>res([]); }); }
function idbPut(sub){ return new Promise(res=>{ let tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(sub); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
function idbDel(id){ return new Promise(res=>{ let tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }

/* Reload / orientation resistant — the current place is saved (one tiny entry,
   overwritten on every navigation, never growing) and restored after the data loads.
   The place also lives in the page address, so the back button works. */
const PLACE_KEY='compartmentalizerLastPlaceV1';
let formTopicId=null;
function hashFor(v){
if(v.view==='chapter' && v.subjectId && v.chapterId) return '#/subject/'+encodeURIComponent(v.subjectId)+'/chapter/'+encodeURIComponent(v.chapterId);
if(v.view==='subject' && v.subjectId) return '#/subject/'+encodeURIComponent(v.subjectId);
return '#/';
}
function savePlace(){
let place={view:state.view, subjectId:state.subjectId, chapterId:state.chapterId, topicId:formTopicId};
try{ localStorage.setItem(PLACE_KEY, JSON.stringify(place)); }catch(e){}
try{ history.replaceState(null, '', hashFor(place)); }catch(e){}
}
function parseHash(){
let m=location.hash.match(/^#\/subject\/([^\/]+)(?:\/chapter\/([^\/]+))?$/);
if(!m) return null;
return {view: m[2] ? 'chapter' : 'subject', subjectId: decodeURIComponent(m[1]), chapterId: m[2] ? decodeURIComponent(m[2]) : null};
}
function restorePlace(){
let p=parseHash();
if(!p){ try{ p=JSON.parse(localStorage.getItem(PLACE_KEY)||'null'); }catch(e){ p=null; } }
if(!p || !p.subjectId) return null;
let sub=findSubject(p.subjectId); if(!sub) return null;
if(p.view==='chapter' && p.chapterId){
let ch=findChapter(sub, p.chapterId); if(!ch) return null;
state.view='chapter'; state.subjectId=sub.id; state.chapterId=ch.id; state.chapterTab='topics';
let topicId=null;
if(p.topicId){ let t=ch.topics.find(x=>x.id===p.topicId); if(t) topicId=t.id; }
return topicId;
}
state.view='subject'; state.subjectId=sub.id; state.chapterId=null; state.subjectTab='chapters';
let topicId=null;
if(p.topicId){ let t=(sub.topics||[]).find(x=>x.id===p.topicId); if(t) topicId=t.id; }
return topicId;
}
window.addEventListener('hashchange', ()=>{
if(location.hash==='#/' || location.hash===''){ formTopicId=null; state.view='main'; state.subjectId=null; state.chapterId=null; render(); return; }
let p=parseHash(); if(!p) return;
let sub=findSubject(p.subjectId); if(!sub) return;
if(p.view==='chapter' && p.chapterId && !findChapter(sub, p.chapterId)) return;
formTopicId=null; state.view=p.view; state.subjectId=p.subjectId; state.chapterId=p.chapterId; if(p.view==='chapter') state.chapterTab='topics'; if(p.view==='subject') state.subjectTab='chapters'; render();
});

async function loadAll(){
await openDB();
if(idbReady){ state.subjects=await idbAll(); }
else { try{ state.subjects=JSON.parse(localStorage.getItem(LS_FALLBACK)||'[]'); }catch(e){ state.subjects=[]; } }
let migrated=false;
state.subjects.forEach(sub=>{
sub.chapters=sub.chapters||[];
if(sub.code===undefined) sub.code='';
if(sub.durationMin===undefined) sub.durationMin=null;
if(sub.maxMarks===undefined) sub.maxMarks=null;
if(sub.dist===undefined){ sub.dist=null; migrated=true; }
sub.dist=normalizeDist(sub.dist);
if(!sub.topics){ sub.topics=[]; migrated=true; }
sub.topics=sub.topics.map(t=>({difficulty:'medium', importance:'important', note:'', ...t, note:(t.note||'')}));
if(!sub.resources){ sub.resources=[]; migrated=true; }
sub.resources=sub.resources.map(r=>({name:'', content:'', url:'', ...r, name:(r.name||''), content:(r.content||''), url:(r.url||'')}));
sub.chapters.forEach(ch=>{
if(!ch.difficulty){ ch.difficulty='medium'; migrated=true; }
if(!ch.importance){ ch.importance='important'; migrated=true; }
ch.topics=(ch.topics||[]).map(t=>({difficulty:'medium', importance:'important', note:'', ...t, note:(t.note||'')}));
if(!ch.questions){ ch.questions=[]; migrated=true; }
ch.questions=ch.questions.map(q=>({part:'A', cat:'K', answer:'', ...q, text:(q.text||'')}));
if(!ch.resources){ ch.resources=[]; migrated=true; }
ch.resources=ch.resources.map(r=>({name:'', content:'', url:'', ...r, name:(r.name||''), content:(r.content||''), url:(r.url||'')}));
});
});
if(migrated && idbReady){ for(let sub of state.subjects) await idbPut(sub); }
let reopenTopic=restorePlace();
render();
applyThemeMeta();
if(reopenTopic) openTopicPopup(null, state.subjectId, state.chapterId, reopenTopic);
}
async function saveSubject(sub){
if(idbReady){ await idbPut(sub); }
else { try{ localStorage.setItem(LS_FALLBACK, JSON.stringify(state.subjects)); }catch(e){} }
}
async function deleteSubjectFromStore(id){
if(idbReady){ await idbDel(id); }
else { try{ localStorage.setItem(LS_FALLBACK, JSON.stringify(state.subjects)); }catch(e){} }
}

/* Backup — everything lives in this browser, so a backup file is the safety net.
   Export downloads all subjects as one JSON file; Import replaces everything
   with the backup file, after a confirmation. */
function exportData(){
let data={app:'compartmentalizer', version:1, exportedAt:new Date().toISOString(), subjects:state.subjects};
let blob=new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
let a=document.createElement('a');
let d=new Date(); let stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
a.href=URL.createObjectURL(blob); a.download='compartmentalizer-backup-'+stamp+'.json';
document.body.appendChild(a); a.click(); a.remove();
setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
showToast('Backup downloaded.');
}
function importData(){ let f=$('importFile'); if(f) f.click(); }
function parseBackup(text){
let data=null;
try{ data=JSON.parse(text); }catch(e){ return null; }
let list=Array.isArray(data) ? data : (data && Array.isArray(data.subjects) ? data.subjects : null);
if(!list || !list.every(x=>x && typeof x.name==='string' && Array.isArray(x.chapters))) return null;
return list;
}
function normalizeImportedSubject(x){
let sub={id:(typeof x.id==='string' && x.id) ? x.id : uid(), name:String(x.name||'Untitled'), code:String(x.code||''), durationMin:(x.durationMin==null?null:x.durationMin), maxMarks:(x.maxMarks==null?null:x.maxMarks), dist:normalizeDist(x.dist), topics:[], resources:[], chapters:[]};
function normTopic(t){ return {id:(t.id||uid()), name:String(t.name||''), difficulty:['easy','medium','hard'].includes(t.difficulty)?t.difficulty:'medium', importance:['less','important','very'].includes(t.importance)?t.importance:'important', note:String(t.note||'')}; }
function normRes(r){ return {id:(r.id||uid()), name:String(r.name||''), content:String(r.content||''), url:String(r.url||'')}; }
sub.topics=(Array.isArray(x.topics)?x.topics:[]).map(normTopic);
sub.resources=(Array.isArray(x.resources)?x.resources:[]).map(normRes);
sub.chapters=(Array.isArray(x.chapters)?x.chapters:[]).map(c=>({id:(c.id||uid()), name:String(c.name||''), difficulty:['easy','medium','hard'].includes(c.difficulty)?c.difficulty:'medium', importance:['less','important','very'].includes(c.importance)?c.importance:'important', topics:(Array.isArray(c.topics)?c.topics:[]).map(normTopic), questions:(Array.isArray(c.questions)?c.questions:[]).map(q=>({id:(q.id||uid()), text:String(q.text||''), part:['A','B','C'].includes(q.part)?q.part:'A', cat:['K','U','A','AN'].includes(q.cat)?q.cat:'K', answer:String(q.answer||'')})), resources:(Array.isArray(c.resources)?c.resources:[]).map(normRes)}));
return sub;
}
async function importFileChanged(e){
let file=e.target.files && e.target.files[0];
e.target.value='';
if(!file) return;
let text='';
try{ text=await file.text(); }catch(err){ showToast('Could not read that file.'); return; }
let list=parseBackup(text);
if(!list){ showToast('That file is not a Compartmentalizer backup.'); return; }
askDelete('Import backup?', 'This will replace all your subjects with the backup file.', async ()=>{
state.subjects=list.map(normalizeImportedSubject);
for(let s of state.subjects) await saveSubject(s);
if(idbReady){ let old=await idbAll(); for(let o of old){ if(!state.subjects.find(x=>x.id===o.id)) await idbDel(o.id); } }
else { try{ localStorage.setItem(LS_FALLBACK, JSON.stringify(state.subjects)); }catch(err){} }
goMain(); showToast('Backup imported.');
});
}
let toastTimer=null;
function showToast(msg, undoFn){
let t=$('toast'); if(!t) return;
t.textContent=msg;
if(undoFn){
let b=document.createElement('button'); b.type='button'; b.className='undo-btn'; b.textContent='Undo';
b.onclick=()=>{ hideToast(); undoFn(); };
t.appendChild(b); t.classList.add('has-undo');
} else { t.classList.remove('has-undo'); }
t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>hideToast(), undoFn?6000:2600);
}
function hideToast(){ let t=$('toast'); if(!t) return; t.classList.remove('show'); t.classList.remove('has-undo'); }

/* Undo — every delete keeps what was removed (and where it was) until the
   toast goes away, so one wrong tap can be taken back. */
let lastUndo=null;
function undoDelete(){
if(!lastUndo) return;
let u=lastUndo; lastUndo=null;
if(u.kind==='subject'){ state.subjects.splice(Math.min(u.index, state.subjects.length), 0, u.item); saveSubject(u.item); }
else {
let sub=findSubject(u.subjectId); if(!sub) return;
let list=null;
if(u.kind==='chapter') list=sub.chapters;
else if(u.kind==='topic') list=topicList(sub, u.chapterId);
else if(u.kind==='question'){ let ch=findChapter(sub, u.chapterId); list=ch ? (ch.questions||(ch.questions=[])) : null; }
else if(u.kind==='resource') list=resourceList(sub, u.chapterId);
if(!list) return;
list.splice(Math.min(u.index, list.length), 0, u.item);
saveSubject(sub);
}
render(); showToast('Restored.');
}
function closeAllDropdowns(){ document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')); }
const DIFF_OPTS=[{v:'easy',l:'Easy'},{v:'medium',l:'Medium'},{v:'hard',l:'Hard'}];
const IMP_OPTS=[{v:'less',l:'Less important'},{v:'important',l:'Important'},{v:'very',l:'Very important'}];
const DUR_OPTS=[{v:'60',l:'1 hour'},{v:'90',l:'1 hour 30 minutes'},{v:'120',l:'2 hours'},{v:'custom',l:'Custom…'}];
const PART_OPTS=[{v:'A',l:'Part A'},{v:'B',l:'Part B'},{v:'C',l:'Part C'}];
const CAT_OPTS=[{v:'K',l:'Remember (K)'},{v:'U',l:'Understand (U)'},{v:'A',l:'Apply (A)'},{v:'AN',l:'Analyze (AN)'}];
function catLabel(v){ let o=CAT_OPTS.find(x=>x.v===v); return o?o.l:v; }
function partLabel(v){ return 'Part '+v; }
function numOr0(v){ let n=parseFloat(v); return Number.isFinite(n)?n:0; }
function normalizeDist(d){
if(!d) return null;
let out={};
['A','B','C'].forEach(p=>{ let x=d[p]||{}; out[p]={marks:numOr0(x.marks), total:numOr0(x.total), attempt:numOr0(x.attempt)}; });
return out;
}
function distTotal(d){ if(!d) return 0; return ['A','B','C'].reduce((n,p)=>n+((d[p].attempt||0)*(d[p].marks||0)),0); }
function anyDist(d){ if(!d) return false; return ['A','B','C'].some(p=>d[p] && (d[p].marks||d[p].total||d[p].attempt)); }
function distError(d, maxMarks){
if(!d || !anyDist(d)) return '';
for(let p of ['A','B','C']){
let x=d[p]||{marks:0,total:0,attempt:0};
if(!x.marks || !x.total || !x.attempt) return 'Fill in marks, total and to attempt for Part '+p+' — or leave the whole distribution blank.';
if(x.attempt>x.total) return 'Part '+p+': you cannot attempt '+x.attempt+' of '+x.total+' questions.';
}
let total=distTotal(d);
if(total!==maxMarks) return 'That adds up to '+total+' marks, but this subject is '+maxMarks+' marks.';
return '';
}
function distLine(d){
if(!d || !anyDist(d)) return '';
return ['A','B','C'].map(p=>'Part '+p+' '+d[p].attempt+' of '+d[p].total+' × '+d[p].marks).join('  ·  ')+'  —  '+distTotal(d)+' marks';
}
function groupQuestionsByPart(qs){
let out={A:[],B:[],C:[]};
(qs||[]).forEach(q=>{ let p=q.part==='B'?'B':(q.part==='C'?'C':'A'); out[p].push(q); });
return out;
}
const PDF_OPTS_KEY='compartmentalizerPdfOptsV1';
const PDF_OPTS_BASE={details:true, resources:true, questions:true, answers:false, chapters:true, chTopics:true, chQuestions:true, chResources:true, subjectTopics:true, subjectResources:true};
let pdfOpts={...PDF_OPTS_BASE};
try{ let saved=JSON.parse(localStorage.getItem(PDF_OPTS_KEY)||'null'); if(saved) pdfOpts={...PDF_OPTS_BASE, ...saved}; }catch(e){}
function savePdfOpts(){ try{ localStorage.setItem(PDF_OPTS_KEY, JSON.stringify(pdfOpts)); }catch(e){} }
let pdfOptionsIsSubject=false;
function ddHTML(kind, value, opts, extra, btnClass){
let cur=opts.find(o=>String(o.v)===String(value))||opts[0];
let menu=opts.map(o=>'<button type="button" class="dd-opt" data-value="'+o.v+'"><span>'+o.l+'</span><span class="tick">'+(String(o.v)===String(value)?'✓':'')+'</span></button>').join('');
return '<div class="dd" data-kind="'+kind+'" data-value="'+value+'" '+extra+'><button type="button" class="'+btnClass+'"><span class="dd-label">'+cur.l+'</span><span class="chev-css"></span></button><div class="dd-menu">'+menu+'</div></div>';
}
function durDDHTML(kind, value, id){
let v=[60,90,120].includes(value)?String(value):'custom';
return ddHTML(kind, v, DUR_OPTS, 'id="'+id+'"', 'dd-btn');
}
</script>

<script>
/* Custom dropdown handling — one delegation for every dropdown on every page */
document.addEventListener('click', e=>{
let btn=e.target.closest('.dd-btn');
if(btn){ e.stopPropagation(); let dd=btn.closest('.dd'); let was=dd.classList.contains('open'); closeAllDropdowns(); if(!was) dd.classList.add('open'); return; }
let opt=e.target.closest('.dd-opt');
if(opt){
let dd=opt.closest('.dd'); let kind=dd.dataset.kind; let val=opt.dataset.value; let label=opt.querySelector('span').textContent;
dd.dataset.value=val; dd.querySelector('.dd-label').textContent=label;
dd.querySelectorAll('.tick').forEach(t=>t.textContent=''); let tick=opt.querySelector('.tick'); if(tick) tick.textContent='✓';
if(kind==='topic-diff'){ dd.querySelector('.dd-btn').className='dd-btn pill diff-'+val; setTopicField(dd.dataset.subject, dd.dataset.chapter, dd.dataset.topic, 'difficulty', val); }
else if(kind==='topic-imp'){ dd.querySelector('.dd-btn').className='dd-btn pill imp-'+val; setTopicField(dd.dataset.subject, dd.dataset.chapter, dd.dataset.topic, 'importance', val); }
else if(kind==='chapter-diff'){ dd.querySelector('.dd-btn').className='dd-btn pill diff-'+val; setChapterField(dd.dataset.subject, dd.dataset.chapter, 'difficulty', val); }
else if(kind==='chapter-imp'){ dd.querySelector('.dd-btn').className='dd-btn pill imp-'+val; setChapterField(dd.dataset.subject, dd.dataset.chapter, 'importance', val); }
else if(kind==='add-dur'){ let w=$('customDurWrap'); if(w) w.style.display = val==='custom' ? 'block':'none'; }
else if(kind==='edit-dur'){ let w=$('editCustomWrap'); if(w) w.style.display = val==='custom' ? 'block':'none'; }
closeAllDropdowns(); return;
}
if(!e.target.closest('.dd')) closeAllDropdowns();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeAllDropdowns(); closeFormKeep(); } });
/* Keyboard support for the custom dropdowns — Down opens and moves, Up moves,
   Escape closes and returns focus to the button. Enter and Space already work:
   the options are real buttons, so they fire a click. */
document.addEventListener('keydown', e=>{
let btn=e.target.closest && e.target.closest('.dd-btn');
if(btn && e.key==='ArrowDown'){
e.preventDefault();
let dd=btn.closest('.dd'); let was=dd.classList.contains('open'); closeAllDropdowns();
if(!was){ dd.classList.add('open'); let first=dd.querySelector('.dd-opt'); if(first) first.focus(); }
return;
}
let opt=e.target.closest && e.target.closest('.dd-opt');
if(opt){
let dd=opt.closest('.dd'); let opts=[...dd.querySelectorAll('.dd-opt')];
let i=opts.indexOf(opt);
if(e.key==='ArrowDown'){ e.preventDefault(); let n=opts[(i+1)%opts.length]; if(n) n.focus(); }
else if(e.key==='ArrowUp'){ e.preventDefault(); let p=opts[(i-1+opts.length)%opts.length]; if(p) p.focus(); }
else if(e.key==='Escape'){ e.preventDefault(); closeAllDropdowns(); let b=dd.querySelector('.dd-btn'); if(b) b.focus(); }
}
});

/* Drafts — if a pop-up closes without adding (tapping outside it, or Escape),
   what was typed is saved and restored the next time the same pop-up opens.
   Closing it manually (Cancel) or adding it clears the draft, so the next
   add starts empty. One draft per form, kept in the browser only. */
const DRAFT_KEY='compartmentalizerDraftsV1';
let formDraftKey=null;
const DRAFT_INPUT_IDS=['fName','fCode','fMarks','customMin','editCustomMin','fChName','fTopicName','fTopicNote','fQText','fQAnswer','fResName','fResContent','fResUrl','distAmarks','distAtotal','distAattempt','distBmarks','distBtotal','distBattempt','distCmarks','distCtotal','distCattempt'];
const DRAFT_DD_IDS=['addChDiff','addChImp','addTopicDiff','addTopicImp','editTopicDiff','editTopicImp','editChDiff','editChImp','durDD','editDurDD','addQPart','addQCat','editQPart','editQCat'];
const DRAFT_DD_KINDS={addChDiff:'addchapter-diff',addChImp:'addchapter-imp',addTopicDiff:'addtopic-diff',addTopicImp:'addtopic-imp',editTopicDiff:'edittopic-diff',editTopicImp:'edittopic-imp',editChDiff:'editchapter-diff',editChImp:'editchapter-imp',durDD:'add-dur',editDurDD:'edit-dur',addQPart:'addq-part',addQCat:'addq-cat',editQPart:'editq-part',editQCat:'editq-cat'};
function loadDrafts(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}'); }catch(e){ return {}; } }
function saveDrafts(d){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); }catch(e){} }
function collectDraft(){
let fields={}, dds={}, toggles={};
DRAFT_INPUT_IDS.forEach(id=>{ let el=$(id); if(el) fields[id]=el.value; });
DRAFT_DD_IDS.forEach(id=>{ let dd=$(id); if(dd) dds[id]={value:dd.dataset.value, kind:DRAFT_DD_KINDS[id]}; });
['code','dur','marks'].forEach(f=>{ toggles[f]=!!subFieldToggles[f]; });
return {fields:fields, dds:dds, toggles:toggles};
}
function saveCurrentDraft(){
if(!formDraftKey) return;
let d=loadDrafts(); d[formDraftKey]=collectDraft(); saveDrafts(d);
}
function clearCurrentDraft(){
if(!formDraftKey) return;
let d=loadDrafts(); delete d[formDraftKey]; saveDrafts(d);
}
function restoreDraft(){
if(!formDraftKey) return;
let d=loadDrafts()[formDraftKey]; if(!d) return;
Object.keys(d.fields||{}).forEach(id=>{ let el=$(id); if(el) el.value=d.fields[id]; });
Object.keys(d.dds||{}).forEach(id=>{
let dd=$(id); if(!dd) return;
let val=d.dds[id].value; dd.dataset.value=val;
let kind=d.dds[id].kind;
let opt=dd.querySelector ? dd.querySelector('.dd-opt[data-value="'+val+'"]') : null;
if(opt){
let label=opt.querySelector('span'); let lab=dd.querySelector('.dd-label'); if(label && lab) lab.textContent=label.textContent;
dd.querySelectorAll('.tick').forEach(t=>t.textContent=''); let tick=opt.querySelector('.tick'); if(tick) tick.textContent='✓';
}
if(kind && (kind.slice(-5)==='-diff' || kind.slice(-4)==='-imp')){
let btn=dd.querySelector('.dd-btn'); if(btn) btn.className='dd-btn pill '+(kind.slice(-5)==='-diff'?'diff-':'imp-')+val;
}
if(kind==='add-dur' || kind==='edit-dur'){ let w=$(kind==='edit-dur'?'editCustomWrap':'customDurWrap'); if(w) w.style.display = val==='custom' ? 'block':'none'; }
});
Object.keys(d.toggles||{}).forEach(f=>{ setSubFieldToggle(f, d.toggles[f]); });
updateDistSummary();
}

/* Drag and drop — topics only, pointer-based, mouse and touch.
   The row follows the finger 1:1 (no transition lag), the list itself never
   moves during the drag — only a drop line shows where it will land — and the
   new order is committed once, when the finger lifts. A tap on the handle
   without moving changes nothing. */
let drag=null, dragJustEnded=false;
function bindDrag(){
document.querySelectorAll('.handle').forEach(h=>{
h.addEventListener('pointerdown', e=>{
e.preventDefault();
let row=h.closest('.topic'); if(!row) return;
let list=row.parentElement;
drag={row:row, handle:h, list:list, startY:e.clientY, subject:row.dataset.subject, chapter:row.dataset.chapter, targetIndex:null};
row.classList.add('dragging'); row.style.transform='translateY(0px)';
try{ h.setPointerCapture(e.pointerId); }catch(err){}
h.addEventListener('pointermove', onDragMove);
h.addEventListener('pointerup', onDragEnd, {once:true});
h.addEventListener('pointercancel', onDragEnd, {once:true});
});
});
}
function onDragMove(e){
if(!drag) return;
let dy=e.clientY-drag.startY; drag.row.style.transform='translateY('+dy+'px)';
let rows=[...drag.list.querySelectorAll('.topic')].filter(r=>r!==drag.row);
rows.forEach(r=>r.classList.remove('drop-before','drop-after'));
let targetIndex=rows.length;
for(let i=0;i<rows.length;i++){ let rect=rows[i].getBoundingClientRect(); if(e.clientY<rect.top+rect.height/2){ targetIndex=i; break; } }
drag.targetIndex=targetIndex;
if(targetIndex<rows.length) rows[targetIndex].classList.add('drop-before');
else if(rows.length) rows[rows.length-1].classList.add('drop-after');
}
async function onDragEnd(){
if(!drag) return;
let d=drag; drag=null;
if(d.handle) d.handle.removeEventListener('pointermove', onDragMove);
d.row.classList.remove('dragging'); d.row.style.transform='';
d.list.querySelectorAll('.topic').forEach(r=>r.classList.remove('drop-before','drop-after'));
dragJustEnded=true; setTimeout(()=>{ dragJustEnded=false; }, 200);
if(d.targetIndex==null) return;
let sub=findSubject(d.subject); if(!sub) return;
if(d.chapter && !findChapter(sub, d.chapter)) return;
let list=topicList(sub, d.chapter);
let id=d.row.dataset.topic;
let item=list.find(t=>t.id===id); if(!item) return;
let from=list.findIndex(t=>t.id===id);
list.splice(from, 1);
let idx=Math.min(d.targetIndex, list.length);
list.splice(idx, 0, item);
await saveSubject(sub); render();
}
</script>

/* Optional subject fields — code, duration and marks each have a small toggle
   in the Add / Edit Subject sheet. On is the normal state; off darkens and
   fades the field and the value is not saved (null). No marks means no mark

let subFieldToggles={code:true, dur:true, marks:true};
function optFieldHTML(field, labelText, innerHTML){
return '<div class="optfield'+(subFieldToggles[field]?'':' off')+'" id="optWrap'+field[0].toUpperCase()+field.slice(1)+'"><div class="opthead"><label>'+labelText+'</label><button type="button" class="switch'+(subFieldToggles[field]?' on':'')+'" role="switch" aria-checked="'+(subFieldToggles[field]?'true':'false')+'" aria-label="'+labelText+'" data-opt="'+field+'" onclick="toggleSubField(\''+field+'\')"></button></div>'+innerHTML+'</div>';

function setSubFieldToggle(field, on){
subFieldToggles[field]=!!on;
let sw=document.querySelector('.switch[data-opt="'+field+'"]'); if(sw){ sw.classList.toggle('on', !!on); sw.setAttribute('aria-checked', on?'true':'false'); }
let wrap=$('optWrap'+field[0].toUpperCase()+field.slice(1)); if(wrap) wrap.classList.toggle('off', !on);
if(field==='marks') updateDistSummary();
}
function toggleSubField(field){ setSubFieldToggle(field, !subFieldToggles[field]); }

/* Pop-ups */
function durationFields(kind, id, value, customValue, showLabel){
if(value==null || value==='') value=120;
let isCustom=![60,90,120].includes(value);
return (showLabel===false?'':'<label>Duration</label>')+durDDHTML(kind, value, id)
+'<div id="'+(kind==='edit-dur'?'editCustomWrap':'customDurWrap')+'" style="display:'+(isCustom?'block':'none')+'"><label>Custom duration — minutes</label><input type="number" id="'+(kind==='edit-dur'?'editCustomMin':'customMin')+'" value="'+(isCustom?value:'')+'" placeholder="e.g. 30 or 45" min="5" max="600" inputmode="numeric"></div>';
}
function readDuration(kind, id){
let dd=$(id); let val=dd ? dd.dataset.value : '120';
if(val==='custom'){ let inp=$(kind==='edit-dur'?'editCustomMin':'customMin'); return parseInt(inp.value,10); }
return parseInt(val,10);
}
function numVal(el){ if(!el || el.value==='' || el.value==null) return 0; let v=parseFloat(el.value); return Number.isFinite(v)?v:0; }
function readDist(){
let d={};
['A','B','C'].forEach(p=>{
d[p]={marks:numVal($('dist'+p+'marks')), total:numVal($('dist'+p+'total')), attempt:numVal($('dist'+p+'attempt'))};
});
return d;
}
function distFieldsHTML(dist){
let d=dist||{A:{marks:'',total:'',attempt:''},B:{marks:'',total:'',attempt:''},C:{marks:'',total:'',attempt:''}};
function row(p){ let x=d[p]||{marks:'',total:'',attempt:''};
return '<div class="dist-part"><div class="dist-head">Part '+p+'</div><div class="grid3">'
+'<div><label>Marks each</label><input type="number" id="dist'+p+'marks" value="'+(x.marks||'')+'" placeholder="e.g. 2" min="1" inputmode="numeric" oninput="updateDistSummary()"></div>'
+'<div><label>Out of</label><input type="number" id="dist'+p+'total" value="'+(x.total||'')+'" placeholder="e.g. 8" min="1" inputmode="numeric" oninput="updateDistSummary()"></div>'
+'<div><label>To attempt</label><input type="number" id="dist'+p+'attempt" value="'+(x.attempt||'')+'" placeholder="e.g. 5" min="1" inputmode="numeric" oninput="updateDistSummary()"></div>'
+'</div></div>'; }
return '<div id="distWrap" style="display:none"><label style="margin-top:18px">Marks distribution — optional</label>'
+row('A')+row('B')+row('C')
+'<p class="mut" id="distSummary" style="margin-top:10px">Optional — leave blank if you have not set it up yet.</p>'
+'<div class="dist-err" id="distError"></div></div>';
}
function updateDistSummary(){
let wrap=$('distWrap'); if(!wrap) return;
let marksOn=subFieldToggles.marks;
let marks=marksOn?parseInt(($('fMarks')||{value:''}).value,10):0;
wrap.style.display=(marksOn && marks>0)?'block':'none';
let d=readDist();
let sum=$('distSummary');
if(sum) sum.textContent=anyDist(d)?('Attempted total: '+distTotal(d)+' of '+(marks||0)+' marks'):'Optional — leave blank if you have not set it up yet.';
let er=$('distError');
if(er){ let err=(marksOn && marks>0)?distError(d, marks):''; er.textContent=err; er.style.display=err?'block':'none'; }
}

/* Save a chapter as PDF — direct download, no print tab.
   Built with jsPDF (loaded on demand, first time only): A4, Apple-style,
   pages flow and topics are kept whole. The print sheet remains only as a
   fallback if the library cannot load. */
let jspdfLoading=null;
function loadJsPDF(){
if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
if(jspdfLoading) return jspdfLoading;
jspdfLoading=new Promise((res,rej)=>{
let sc=document.createElement('script');
sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
sc.onload=()=>res(); sc.onerror=()=>rej(new Error('jsPDF failed to load'));
document.head.appendChild(sc);
});
return jspdfLoading;
}
function pdfSafeName(name){ return String(name||'').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim() || 'Chapter'; }
function diffColor(v){ return v==='easy' ? [19,115,51] : v==='hard' ? [200,30,30] : [29,29,31]; }
function impColor(v){ return v==='very' ? [124,45,18] : [29,29,31]; }
const TOOL_URL='https://abybijo.github.io/learning-tools/tools/compartmentalizer.html';
function makePdf(){
let doc=new window.jspdf.jsPDF({unit:'mm', format:'a4'});
let W=210, M=20, CW=W-2*M, FOOT=282;
let y=M;
const INK=[29,29,31], GREY=[110,110,115], LINE=[226,226,231], LIGHT=[245,245,247];
function pill(x, baseline, label, color){
doc.setFont('helvetica','bold'); doc.setFontSize(9);
let w=doc.getTextWidth(label)+8;
doc.setFillColor(LIGHT[0],LIGHT[1],LIGHT[2]); doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(0.3);
doc.roundedRect(x, baseline-4.5, w, 7, 3.5, 3.5, 'FD');
doc.setTextColor(color[0],color[1],color[2]); doc.text(label, x+4, baseline);
return w;
}
function pillsRow(labels, centreY){
doc.setFont('helvetica','bold'); doc.setFontSize(9);
let widths=labels.map(l=>doc.getTextWidth(l.text)+8);
let total=widths.reduce((a,b)=>a+b,0)+6*(labels.length-1);
let x=(W-total)/2;
labels.forEach((l,i)=>{ x+=pill(x, centreY, l.text, l.color); if(i<labels.length-1) x+=6; });
}
function need(height){ if(y+height>FOOT-10){ doc.addPage(); y=M; } }
function rule(){ doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(0.4); doc.line(M, y, W-M, y); y+=12; }
function footer(){
let pages=doc.getNumberOfPages();
for(let i=1;i<=pages;i++){
doc.setPage(i);
doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(0.3); doc.line(M, FOOT-6, W-M, FOOT-6);
doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
doc.text('Made with Compartmentalizer', M, FOOT);
doc.link(M, FOOT-3.5, doc.getTextWidth('Made with Compartmentalizer'), 5, {url:TOOL_URL});
doc.setFont('helvetica','bold'); doc.setTextColor(INK[0],INK[1],INK[2]);
let gh='GitHub'; let gw=doc.getTextWidth(gh);
doc.text(gh, W-M-gw, FOOT);
doc.link(W-M-gw, FOOT-3.5, gw, 5, {url:TOOL_URL});
doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
doc.text(String(i), W/2, FOOT, {align:'center'});
}
}
function eyebrow(){
doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(GREY[0],GREY[1],GREY[2]);
doc.text('COMPARTMENTALIZER', W/2, y, {align:'center'}); y+=4;
doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(0.4); doc.line(W/2-12, y, W/2+12, y); y+=13;
}
function topicBlock(num, t){
let titleLines=doc.splitTextToSize(num+'. '+t.name, CW);
let noteLines=t.note ? doc.splitTextToSize(t.note, CW) : ['No notes.'];
let blockH=titleLines.length*7 + 11 + noteLines.length*6 + 12;
need(blockH);
doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(INK[0],INK[1],INK[2]);
doc.text(titleLines, M, y); y+=titleLines.length*7+1;
doc.setFont('helvetica','bold'); doc.setFontSize(9);
let w1=doc.getTextWidth(diffLabel(t.difficulty))+8;
pill(M, y+2, diffLabel(t.difficulty), diffColor(t.difficulty));
pill(M+w1+6, y+2, impLabel(t.importance), impColor(t.importance));
y+=11;
doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(t.note?INK[0]:GREY[0], t.note?INK[1]:GREY[1], t.note?INK[2]:GREY[2]);
doc.text(noteLines, M, y); y+=noteLines.length*6+4;
doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(0.3); doc.line(M, y, W-M, y); y+=9;
}
return {doc, W, M, CW, FOOT, INK, GREY, LINE,
getY:function(){ return y; }, setY:function(v){ y=v; }, addY:function(d){ y+=d; },
pill:pill, pillsRow:pillsRow, need:need, rule:rule, footer:footer, eyebrow:eyebrow, topicBlock:topicBlock};
}

if(sub.maxMarks!=null) headParts.push(sub.maxMarks+' marks');
headParts.push(sub.chapters.length+' chapters', totalTopics+' topics', totalResources+' resources');
doc.text(headParts.join('  ·  '), P.W/2, P.getY(), {align:'center'}); P.addY(8);
if(sub.dist && anyDist(sub.dist)){ doc.setFontSize(11); doc.text(distLine(sub.dist), P.W/2, P.getY(), {align:'center'}); P.addY(8); }
P.addY(6);
P.rule();
let renderedAny=false;
sub.chapters.forEach((ch, ci)=>{
if(!pdfOpts.chapters) return;
if(renderedAny){ doc.addPage(); P.setY(P.M); }
renderedAny=true;
doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(P.INK[0],P.INK[1],P.INK[2]);
let chLines=doc.splitTextToSize(ch.name, P.CW);
doc.text(chLines, P.W/2, P.getY(), {align:'center'}); P.addY(chLines.length*9+4);
P.pillsRow([{text:diffLabel(ch.difficulty), color:diffColor(ch.difficulty)}, {text:impLabel(ch.importance), color:impColor(ch.importance)}], P.getY()); P.addY(6);
doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(P.GREY[0],P.GREY[1],P.GREY[2]);
doc.text(ch.topics.length+' topic'+(ch.topics.length===1?'':'s')+'  ·  '+(ch.questions||[]).length+' question'+((ch.questions||[]).length===1?'':'s')+'  ·  '+(ch.resources||[]).length+' resource'+((ch.resources||[]).length===1?'':'s'), P.W/2, P.getY(), {align:'center'}); P.addY(12);
P.rule();
if(pdfOpts.chTopics){ ch.topics.forEach((t,i)=>{ P.topicBlock(String(i+1), t); }); }
if(pdfOpts.chQuestions){ addQuestionsToPdf(P, ch, sub, pdfOpts.answers); }
if(pdfOpts.chResources){ addResourcesToPdf(P, ch.resources); }
});
if(pdfOpts.subjectTopics && (sub.topics||[]).length){
if(renderedAny){ doc.addPage(); P.setY(P.M); }
renderedAny=true;
doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(P.INK[0],P.INK[1],P.INK[2]);
doc.text('Subject topics', P.W/2, P.getY(), {align:'center'}); P.addY(13);
doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(P.GREY[0],P.GREY[1],P.GREY[2]);
doc.text(sub.topics.length+' topic'+(sub.topics.length===1?'':'s'), P.W/2, P.getY(), {align:'center'}); P.addY(12);
P.rule();
sub.topics.forEach((t,i)=>{ P.topicBlock(String(i+1), t); });
}
if(pdfOpts.subjectResources && (sub.resources||[]).length){
if(renderedAny){ doc.addPage(); P.setY(P.M); }
renderedAny=true;
addResourcesToPdf(P, sub.resources);
}
P.footer();
doc.save(pdfSafeName(sub.name)+'.pdf');
showToast('PDF downloaded.');
}
loadAll();
</script>
</body>
</html>
