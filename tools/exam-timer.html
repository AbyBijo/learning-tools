<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Exam Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 48px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#86868b;font-weight:600}
h1{font-size:40px;line-height:1.05;letter-spacing:-.03em;margin:10px 0 8px;font-weight:800}
h2{font-size:17px;letter-spacing:-.01em;margin:0 0 12px;font-weight:700}
.sub{color:#86868b;font-size:15px;margin:0}
.card{background:#fff;border-radius:20px;padding:28px 24px;margin-top:20px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.mut{color:#86868b;font-size:13px;line-height:1.5}
.seg{display:flex;gap:3px;background:#f5f5f7;border-radius:12px;padding:3px;max-width:520px;margin:0 auto}
.seg button{flex:1;border:0;background:transparent;color:#86868b;padding:13px 8px;border-radius:9px;font-weight:600;font-size:15px;cursor:pointer}
.seg button.on{background:#1d1d1f;color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{width:100%;max-width:520px;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;background:#0071e3;color:#fff}
.btn.sec{background:#f5f5f7;color:#1d1d1f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.99)}
.row{display:flex;gap:10px;margin-top:12px;justify-content:center}
.row .btn{flex:1}
input[type=file]{display:none}
.drop{display:block;border:1.5px dashed #d2d2d7;border-radius:14px;padding:24px;cursor:pointer;background:#f5f5f7;max-width:520px;margin:0 auto}
.drop b{display:block;font-size:15px}
.drop span{color:#86868b;font-size:13px}
.timerbar{position:sticky;top:12px;z-index:30;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #e2e2e7;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.timerbar.warn{background:#fff1f1}
.timerbar .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#86868b;font-weight:600}
.timerbar .time{font-family:"JetBrains Mono",monospace;font-size:clamp(48px,11vw,76px);font-weight:700;line-height:1;letter-spacing:-3px;margin-top:6px}
.timerbar .meta{display:flex;justify-content:center;gap:16px;font-size:12px;color:#86868b;margin-top:10px;flex-wrap:wrap}
.bar{height:4px;background:#e2e2e7;border-radius:99px;overflow:hidden;margin-top:14px;max-width:520px;margin-left:auto;margin-right:auto}
.bar i{display:block;height:100%;background:#0071e3;transition:width .5s linear}
.pdfwrap{margin-top:20px;text-align:left}
.pdfpage{background:#fff;border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pdfpage canvas{width:100%;height:auto;display:block}
.pagelabel{font-size:12px;color:#86868b;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.tools button{border:1px solid #e2e2e7;background:#fff;color:#1d1d1f;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.open{display:flex}
.modalbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:420px;text-align:center}
.modalbox h2{font-size:21px}
#timeup{position:fixed;inset:0;background:rgba(0,0,0,.85);color:#fff;display:none;align-items:center;justify-content:center;z-index:60;padding:24px;text-align:center}
#timeup.open{display:flex}
#timeup h2{font-size:44px;letter-spacing:-.03em;margin:0}
.section{margin-top:28px}
.section:first-child{margin-top:0}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="eyebrow">Exam Timer</div>
<h1>Exam Timer</h1>
<p class="sub">Choose a duration. Load a paper. Start.</p>
</header>

<div id="setupCard" class="card">
<div class="section">
<h2>Duration</h2>
<div class="seg" id="durSeg">
<button class="on" data-min="90">1h 30m</button>
<button data-min="105">1h 45m</button>
<button data-min="120">2h</button>
</div>
<p class="mut" id="durNote" style="margin-top:10px">1h 30m</p>
</div>

<div class="section">
<h2>Paper</h2>
<label class="drop" for="pdfFile"><b>Load PDF</b><span id="pdfName">No paper yet</span></label>
<input type="file" id="pdfFile" accept="application/pdf">
<div class="tools" id="pdfTools" style="display:none">
<button onclick="zoomOut()">−</button>
<button onclick="zoomIn()">+</button>
<button onclick="scrollToTop()">Top</button>
</div>
<p class="mut" id="pdfStatus"></p>
</div>

<div class="section">
<h2>Start</h2>
<button class="btn" id="startBtn" onclick="askStart()">Start</button>
<p class="mut" style="margin-top:12px">No pause. No stop.<br>Closing the page does not stop it.</p>
</div>
</div>

<div id="timerCard" style="display:none">
<div class="timerbar" id="timerBar">
<div class="label" id="timerLabel">Time remaining</div>
<div class="time" id="clock">1:30:00</div>
<div class="bar"><i id="prog" style="width:0%"></i></div>
<div class="meta"><span id="elapsedLabel">Elapsed 00:00</span><span id="endLabel"></span><span id="warnLabel"></span></div>
</div>
</div>

<div class="pdfwrap" id="pdfWrap"></div>
<div id="pdfEmpty" class="card" style="display:none">
<p class="mut" style="margin:0">No paper loaded.</p>
</div>
</div>

<div id="modal"><div class="modalbox">
<h2>Start?</h2>
<p class="mut" id="modalText"></p>
<div class="row"><button class="btn sec" onclick="closeModal()">Back</button><button class="btn" id="modalConfirm">Start</button></div>
</div></div>

<div id="timeup"><div>
<h2>Time’s up.</h2>
<button class="btn" style="max-width:320px;margin:20px auto 0" onclick="newExam()">New exam</button>
</div></div>

<script>
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
const KEY='examTimerGeneralV1';
let durationMin=90, pdfDoc=null, zoom=1.0;
let endTime=null, totalMs=0, interval=null, finished=false;
function $(id){return document.getElementById(id);}
function fmt(s){let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function fmtClock(s){let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return h>0?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
document.querySelectorAll('#durSeg button').forEach(b=>b.onclick=()=>{ if(endTime) return; document.querySelectorAll('#durSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); durationMin=parseInt(b.dataset.min,10); $('durNote').textContent=b.textContent; });
function askStart(){ $('modalText').textContent=document.querySelector('#durSeg button.on').textContent+'. No pause. No stop.'; $('modal').classList.add('open'); $('modalConfirm').onclick=()=>{ closeModal(); startTimer(); }; }
function closeModal(){ $('modal').classList.remove('open'); }
function startTimer(){
totalMs=durationMin*60*1000; endTime=Date.now()+totalMs;
localStorage.setItem(KEY, JSON.stringify({endTime:endTime, durationMin:durationMin}));
showRunning(); tick();
if(interval) clearInterval(interval); interval=setInterval(tick, 500);
try{ if(navigator.wakeLock) navigator.wakeLock.request('screen'); }catch(e){}
}
function showRunning(){
$('setupCard').style.display='none'; $('timerCard').style.display='block'; $('pdfEmpty').style.display=pdfDoc?'none':'block';
document.querySelectorAll('#durSeg button').forEach(b=>b.disabled=true);
}
function tick(){
let remain=Math.max(0, endTime-Date.now()); let elapsed=totalMs-remain;
$('clock').textContent=fmtClock(Math.ceil(remain/1000));
$('elapsedLabel').textContent='Elapsed '+fmt(Math.floor(elapsed/1000));
$('prog').style.width=(elapsed/totalMs*100)+'%';
let end=new Date(endTime); $('endLabel').textContent='Ends '+end.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
let warn=$('warnLabel'); if(remain<=10*60*1000 && remain>0){ warn.textContent='Last 10 min'; $('timerBar').classList.add('warn'); } else if(remain<=20*60*1000 && remain>0){ warn.textContent='20 min left'; } else { warn.textContent=''; }
if(remain<=0){ finishTimer(); }
}
function finishTimer(){
if(finished) return; finished=true; clearInterval(interval);
$('clock').textContent='0:00:00'; $('timerLabel').textContent='Finished';
try{ let ctx=new (window.AudioContext||window.webkitAudioContext)(); [523,659,784].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=f; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(.12,ctx.currentTime+i*.25); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.25+.5); o.start(ctx.currentTime+i*.25); o.stop(ctx.currentTime+i*.25+.55);}); }catch(e){}
if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
$('timeup').classList.add('open');
}
function newExam(){
localStorage.removeItem(KEY); endTime=null; finished=false; $('timeup').classList.remove('open'); $('timerCard').style.display='none'; $('setupCard').style.display='block'; document.querySelectorAll('#durSeg button').forEach(b=>b.disabled=false);
$('clock').textContent=fmtClock(durationMin*60); $('timerLabel').textContent='Time remaining'; $('timerBar').classList.remove('warn'); $('prog').style.width='0%';
}
function zoomIn(){ zoom=Math.min(2.2, zoom+0.2); renderAll(); }
function zoomOut(){ zoom=Math.max(0.7, zoom-0.2); renderAll(); }
function scrollToTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
$('pdfFile').addEventListener('change', async (e)=>{
let file=e.target.files[0]; if(!file) return; $('pdfName').textContent=file.name;
if(!window.pdfjsLib){ $('pdfStatus').textContent='PDF viewer needs internet on first load.'; return; }
try{
let buf=await file.arrayBuffer(); pdfDoc=await pdfjsLib.getDocument({data:buf}).promise;
$('pdfTools').style.display='flex'; $('pdfEmpty').style.display='none'; $('pdfStatus').textContent=pdfDoc.numPages+' pages';
renderAll();
}catch(err){ $('pdfStatus').textContent='Could not open that PDF.'; }
});
async function renderAll(){
if(!pdfDoc) return; let wrap=$('pdfWrap'); wrap.innerHTML='';
for(let i=1;i<=pdfDoc.numPages;i++){
let page=await pdfDoc.getPage(i); let containerW=wrap.clientWidth||800; let base=page.getViewport({scale:1}); let scale=(containerW-24)/base.width*zoom; let vp=page.getViewport({scale:scale});
let div=document.createElement('div'); div.className='pdfpage'; div.innerHTML='<div class="pagelabel"><span>Page '+i+'</span><span>'+i+' of '+pdfDoc.numPages+'</span></div>';
let canvas=document.createElement('canvas'); canvas.width=vp.width; canvas.height=vp.height; div.appendChild(canvas); wrap.appendChild(div);
await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise;
}
}
window.addEventListener('beforeunload', e=>{ if(endTime && Date.now()<endTime && !finished){ e.preventDefault(); e.returnValue=''; } });
(function(){
try{
let saved=JSON.parse(localStorage.getItem(KEY)||'null'); if(!saved) { $('clock').textContent=fmtClock(durationMin*60); return; }
if(saved.endTime>Date.now()){ durationMin=saved.durationMin; totalMs=durationMin*60*1000; endTime=saved.endTime; document.querySelectorAll('#durSeg button').forEach(b=>{ b.classList.toggle('on', parseInt(b.dataset.min,10)===durationMin); }); showRunning(); tick(); interval=setInterval(tick,500); }
else { localStorage.removeItem(KEY); }
}catch(e){}
})();
</script>
</body>
</html>
